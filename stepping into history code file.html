async function halpernTalk(){
 if(G.f.met)return say("halpern","Everything, Hana. Papers, tickets, posters, people's own words.");
 await say("halpern","Hana. You have sharp eyes. Some of us are collecting everything that happens here, in secret. We call it Oneg Shabbat.");
 const a=await say("halpern","If none of us survive, the papers will speak for us. Will you help?",["Yes. What should I collect?","Why save posters when people are starving?"]);
 if(a===1)await say("halpern","Because one day the world will ask what happened here. And the Germans will not tell the truth.");
 addSrc("oneg");G.f.met=1;addItem("ration");obj("Collect for the archive","Talk to people. Take what tells the truth. Jump the rubble to reach the poster on the wall.");
}
async function schoolTalk(){
 if(G.f.school)return say("narr","The class goes on, quietly.");G.f.school=1;addSrc("spiritual");
 const a=await say("narr","In a back room, a dozen students study poetry and mathematics. Schools are forbidden here. Learning anyway is a kind of resistance.",["Stay for the lesson","Ask the students to write about their lives for the archive"]);
 if(a===1){addItem("essays");await say("narr","They write all afternoon: about hunger, about their families, about what they want to be.");await consq("The students' own words will go into the archive.","The archive deliberately collected children's and ordinary people's voices, not only official papers.")}
 else{await say("narr","For an hour, the ghetto disappears. Then you go back out into the cold.");await consq("You stayed for the lesson and learned something forbidden.","Secret schools were unarmed resistance: refusing to let the Nazis take away learning, culture and the future.")}
}
async function cookTalk(){addSrc("aleynhilf");if(!G.f.met)return say("cook","One bowl each. Some days there is nothing.");addItem("ticket");await say("cook","The house committee runs this kitchen. One bowl each. Take a ticket; it's all we have to give the archive.")}
async function feldTalk(){
 if(G.items.includes("testimony"))return say("feld","Thank you for listening.");
 if(!G.f.met)return say("feld","…");
 const a=await say("feld","We came from a small town to the west. They gave us twenty minutes to leave our home.",["Listen. Don't write yet.","Write down every word, quickly","Ask what she wants people to remember"]);
 if(a===1){await say("narr","She sees your pencil racing and stops halfway. You have part of her story.");await consq("You rushed, and she stopped. You have only part of her story.","Collecting testimony takes patience and respect. Rushing a witness can lose the truth.")}
 else{await say("feld","My husband's name was Aron. He made violins. Write that he made violins.");await consq("Because you listened first, she told you her husband's name and his work.","Testimony turns statistics into people. That was the archive's purpose.")}
 addItem("testimony");addSrc("testimony");
}
async function szmulekTalk(){
 if(!G.f.met)return say("szmulek","Not now.");addSrc("smuggle");
 const a=await say("szmulek","I go under the wall twice a day. Potatoes, mostly. My mother can't walk anymore.",["Ask if you can write down his story","Give him your bread"]);
 if(a===1){G.f.bread=1;await say("narr","He eats it in four bites, then hands you something from his pocket.");await consq("You gave away your only bread today.","In the ghetto, sharing food was a life-and-death choice. Small acts of solidarity were everywhere.")}
 addItem("wrapper");await say("szmulek","A candy wrapper, from the other side. Put it in your archive. Proof the world is still there.");
}
async function youthTalk(){if(!G.f.met)return say("youth","…");addItem("paper");addSrc("spiritual");await say("youth","Our movement's newspaper. We print it in a cellar. Read it, then hide it.")}
async function boxTalk(){
 if(G.f.boxed)return;
 await say("halpern","Ten tin boxes, and not much room. Choose what goes in. Choose carefully, Hana.");
 const chosen=await pick("What goes into the box? Choose up to 5.",G.items.map(k=>ITEMS[k]),5);
 G.saved=chosen.map(i=>G.items[i]);await consq(`${chosen.length} item${chosen.length===1?"":"s"} go into the box. Everything else stays behind and may be lost.`,"Archivists had to decide what the future would know. Every archive, including the sources in your textbook, reflects choices about what to save.");
 const t=await say("halpern","Write your own testament too. One line. What do you want them to know?",["\"I want the world to know we were here.\"","\"Remember my mother's name: Sara Rozen.\"","\"We did not stop learning, even here.\""]);
 G.f.testament=["I want the world to know we were here.","Remember my mother's name: Sara Rozen.","We did not stop learning, even here."][t];G.f.boxed=1;
 await say("narr","You seal the box and push it into the hollow in the cellar wall. Bricks and earth go over it. Upstairs, the street is silent.");
 ending();
}
H.ending=()=>{
 const sv=(G.saved||[]).map(k=>ITEMS[k]);

  sv.length?`You saved: ${sv.join("; ")}. And one line in your own hand: "${G.f.testament}"`:`You saved one line in your own hand: "${G.f.testament}"`,
  "What really happened: between July 22 and September 21, 1942, German SS and police units, with auxiliaries, deported about 265,000 Jews from the Warsaw ghetto to the Treblinka killing center. About 35,000 more were killed inside the ghetto.",
  "Hana is fictional. The real archive was buried on August 3, 1942, by teacher Izrael Lichtensztajn and two of his students, Dawid Graber, 19, and Nachum Grzywacz. That day they wrote their own testaments. Graber wrote that what they could not cry out to the world, they buried in the ground.",
  "The ten metal boxes were dug out of the ruins on September 18, 1946. Two milk cans holding a second part were found on December 1, 1950. A third part has never been found.",
  "Emanuel Ringelblum and almost all of the archive's members were murdered. One of the few survivors, Rachel Auerbach, said: \"We had more luck saving documents than we had in saving people.\"",
  "We don't know what happened to Hana after August 1942. For many people whose words are in the archive, that is all anyone knows."],
  cards:[["What ghettos were","The Nazis forced Jews into sealed districts to isolate, exploit and starve them, and later to deport them to killing centers."],["Resistance took many forms","Secret schools, prayer, smuggling, newspapers and documentation were acts of defiance. In April 1943 the ghetto's remaining fighters rose up in armed revolt."],["The archive is evidence","Oneg Shabbat's papers are among the most important records of the Holocaust, written by its victims, not its perpetrators."],["Listen to survivors","Recorded survivor testimony, from USC Shoah Foundation (IWitness) and USHMM, continues the archive's purpose today."]],
  discuss:["Why did the archive save ordinary things like tickets and candy wrappers? What do they show that a decree doesn't?","You could only choose five items. What did you leave out, and what is lost?","How was documenting the truth a form of resistance?","Most Holocaust documents were written by the perpetrators. Why does that make the Oneg Shabbat archive so important?","Why is it important for your generation to learn from the Holocaust, and to hear survivor testimony?"]}};

async function mamaG(){if(G.f.card)return say("mamag","Go on, Grace. Be home before dark.");G.f.card=1;addSrc("idcards");
 await say("mamag","Grace, you'll need your identity card for the new school form. Here.");
 await say("narr","Your card says, under ethnic group: Tutsi. The Belgians who once ruled Rwanda made everyone carry one. You never thought much about it. Lately, you do.");
 obj("An ordinary afternoon","Visit your friend, the shop, Mama Beata and your brother Eric.")}
async function jpTalk(){if(G.f.jp)return say("jp","See you at school tomorrow.");G.f.jp=1;
 const a=await say("jp","My uncle says Tutsi are planning to take over the country. He hears it on the radio every day.",["\"Jean-Paul, I'm Tutsi. Am I planning something?\"","\"The radio lies.\"","Change the subject. Ask about football."]);
 await say("jp",["…No. You're Grace. That's different.","Maybe. My uncle believes it, though. Lots of people do.","Saturday, two o'clock. Don't be late again."][a]);
 await consq(["Jean-Paul makes an exception for you, but not for Tutsi in general.","Jean-Paul isn't sure what to believe anymore.","You let it go. Jean-Paul's uncle keeps talking."][a],"Propaganda teaches people to hate a group while excusing the few people they know. That is how ordinary neighbors were turned against each other.")}
async function radioTalk(){if(G.f.radio)return say("shop","Turn it down? Everyone listens to RTLM.");G.f.radio=1;addSrc("rtlm");
 await say("narr","The shop radio is tuned to RTLM. Between popular songs, the announcer calls Tutsi \"inyenzi\": cockroaches. He laughs. The men by the counter laugh too.");
 const a=await say("shop","",["Ask him to change the station","Leave without buying anything","Stay quiet and buy the sugar"]);
 await say("shop",["Change it? Girl, this is the station everyone listens to.","Suit yourself.","Sugar. That's all. Go home now, child."][a]);
 await consq(["You spoke up. The men at the counter look at you differently now.","You walked out. No one stopped the radio.","You stayed quiet. The radio kept talking."][a],"Hate radio worked because so many people heard it every day and few spoke against it. Speaking up took courage, and could make you a target.")}
async function beataTalk(){if(G.f.beata)return say("beata","Remember what I said.");G.f.beata=1;
 await say("beata","Grace. Things on that radio frighten me. If anything happens, anything, you bring Eric to me. My back room has a cupboard in front of the door.");
 await say("narr","Mama Beata is Hutu. She has known you since you were born.",["\"Thank you, Mama Beata.\"","\"Nothing will happen. Will it?\""])}
async function ericTalk(){if(!G.f.radio||!G.f.beata)return say("eric","Grace! Watch me kick it over the wall!");
 await say("eric","Grace, look, it's getting dark. Is it time to go home?");
 await say("narr","That night, the president's plane is shot down over Kigali. By morning there are roadblocks on every road, and the radio is reading out names.");
 await say("mamag","Grace. Take Eric to Mama Beata's. Now. I will come for you when I can.",["\"Come with us, Mama!\"","Take Eric's hand and go"]);
 G.day=1;go("r_hide",120,"April 7, 1994")}
async function radioHide(){if(G.f.d1)return say("narr","The radio crackles.");G.f.d1=1;G.day=12;addSrc("unamir");
 await say("narr","Day 12. Mama Beata keeps the radio low. A foreign station reports that the United Nations is pulling most of its peacekeepers out of Rwanda. Fewer than three hundred will stay.")}
async function beataHide(){if(G.f.d2)return say("beata","Eat, child. You must stay strong for Eric.");G.f.d2=1;G.day=Math.max(G.day,34);
 const a=await say("beata","Day 34. I could only find a little beans today. They watch who buys more food than they need.",["\"Have you heard anything about Mama?\"","\"Why are you doing this for us?\""]);
 await say("beata",["…No one has seen her, Grace. I am asking. Quietly.","Because you are children. Because God sees what we do. Because if I don't, who will?"][a]);addSrc("rescuers")}
async function ericHide(){if(G.f.d3)return say("eric","Tell me the story again, Grace.");G.f.d3=1;G.day=Math.max(G.day,57);
 const a=await say("eric","Day 57. I want to go outside. I want Mama.",["Whisper him a story about the cow that could fly","Hold him until he falls asleep","Teach him to count without making a sound"]);
 await say("narr",["He giggles once, then covers his own mouth.","He sleeps. You don't.","He counts to a hundred on his fingers. Then again."][a])}
async function knockTalk(){
 await say("narr","Day 71. Boots outside. Someone pounds on the front door. Mama Beata goes to answer it.");
 await say("narr","You hold Eric against you and don't breathe.",["Stay perfectly still"]);
 await say("narr","Through the wall you hear her laugh, offer them beer, complain about her bad knee. After a long time, the door shuts. Mama Beata does not come back to the room for an hour. When she does, her hands are shaking.");
 G.day=100;await say("narr","Day 100. In July the Rwandan Patriotic Front takes Kigali. The radio stops. Someone outside is shouting that it's over.");
 go("r_july",120,"Kigali · July 1994")}
async function rpfTalk(){if(G.f.rpf)return say("rpf","Go carefully.");G.f.rpf=1;await say("rpf","Are you hurt? Is there anyone else in that house? Go carefully, the roads aren't safe yet. Look for your people at the church.")}
async function neighborTalk(){if(G.f.nb)return say("neighbor","I'm sorry, Grace.");G.f.nb=1;
 await say("neighbor","Grace? You're alive. And Eric? Thank God.");
 await say("neighbor","Your mother… she went to the roadblock in April, to look for your uncle. She never came back. I'm so sorry.",["Say nothing","\"Who was at the roadblock?\""]);
 await say("neighbor","Men from here. Some we knew.")}
async function homeTalk(){await say("narr","The door is open. The house is empty. Mama's chair is still by the window.");go("r_gacaca",120,"Eleven years later · a gacaca court · 2005")}
async function judgeTalk(){if(G.f.judge)return say("judge","Listen to the confession first.");G.f.judge=1;addSrc("gacaca");await say("judge","Grace Uwase. Today the accused will speak about the roadblock in your neighborhood. Then the community, and you, may speak.")}
async function confessTalk(){if(G.f.conf)return say("confessor","I have said everything.");G.f.conf=1;
 await say("narr","He wears the pink uniform of a Rwandan prisoner. You know him. He used to sell you sugar.");
 await say("confessor","I stood at that roadblock. I checked identity cards. I let others do what they did. I ask this community, and this girl, for forgiveness.");
 const a=await say("narr","Everyone is looking at you.",["\"Tell me where my mother is buried.\"","\"I can't forgive you. Not today.\"","\"I forgive you. I don't do it for you.\""]);
 G.f.resp=a;await say("confessor",["…Near the old church path. I will show them where. She can be buried properly.","I understand.","…Thank you."][a]);
 await consq(["He will show the community where your mother lies, so she can be buried with dignity.","You did not forgive him. No one can demand that of you.","You forgave him, for your own sake."][a],"Gacaca courts sought truth, accountability and a way to live side by side again. Survivors had the right to choose how to respond.")}
async function beataEnd(){addSrc("kwibuka");await say("beata","You and Eric are grown now. That is what I prayed for, in that room.",["\"You saved our lives, Mama Beata.\"","Hug her"]);ending()}
R.ending=()=>{const p=[];
 p.push(["The confession led to your mother's remains. You buried her with her family, the way she should have been buried. Many survivors asked the gacaca courts the same thing: where are our dead?","You did not forgive him that day. Many survivors never did, and no one could demand it of them.","You forgave him, for your own sake. Some survivors found forgiveness possible; many did not. Both are part of Rwanda's story."][G.f.resp??0]);
 p.push("Grace, Eric, their mother, Jean-Paul and Mama Beata are fictional, built from survivor and rescuer accounts. Some Hutu neighbors really did hide Tutsi at the risk of their own lives; they were few.");
 p.push("What really happened: from April to July 1994, between 500,000 and one million people were murdered, most of them Tutsi, along with Hutu who opposed the killing. It took about one hundred days.");
 p.push("Months before, the UN peacekeeping commander, General Roméo Dallaire, warned that extremists were planning to exterminate Tutsi. His requests for more troops were denied. When the killing began, the UN cut its force to 270 soldiers. U.S. officials avoided the word \"genocide\" for weeks, saying only that \"acts of genocide\" had occurred. In 1998 President Clinton went to Kigali and acknowledged the world's failure to act.");
 p.push("The community gacaca courts closed in 2012 after hearing nearly two million cases. Every April 7, Rwanda begins Kwibuka, \"to remember.\"");
 return{title:"Kwibuka: remember",paras:p,
  cards:[["Words came first","Identity cards, years of propaganda and radio stations like RTLM taught people to see neighbors as enemies before the killing began."],["The world was warned","The UN commander's warnings were ignored, and peacekeepers were withdrawn instead of reinforced. Most foreigners were evacuated."],["Bystanders, perpetrators, rescuers","Ordinary people chose. Most victims were killed by neighbors; a few neighbors risked everything to hide them."],["\"Never again\" again","Fifty years after the Holocaust, genocide happened again. Studying it asks what people and governments must do when warnings come."]],
  discuss:["How did identity cards and radio propaganda prepare people to kill their neighbors?","Why do you think the United States avoided the word \"genocide\" in 1994? What difference does a word make?","Compare the Warsaw ghetto and Rwanda: what was similar about how genocide was organized, and what was different?","Mama Beata took a huge risk. What makes some people rescuers while most stay bystanders?","Should survivors be asked to forgive? What did the gacaca courts try to do, and what are their limits?"]}};

 <div style="border-left:4px solid var(--glow);padding:6px 0 6px 18px"><span style="font-size:14px;color:var(--glow)">Our mission</span><p style="margin:2px 0 0;font-family:'IM Fell English',Georgia,serif;font-size:clamp(22px,3vw,30px);line-height:1.2;max-width:40ch">To teach historical empathy to students, and to people everywhere: to understand the past through the eyes of the people who lived it.</p></div>
 <div><h1 style="font-size:clamp(34px,5vw,52px);margin:0 0 6px;line-height:1.05">Step into history.</h1>
 <p style="max-width:68ch;margin:0">Seven missions for grades 9–12, in timeline order. In each one you play a young person at a turning point in history. Walk, jump, talk, choose. There's no score and no way to win; every choice is one that real people faced.</p></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="jbtn snd" id="sndT">Sound</button><button class="jbtn vob" id="voT">Voices</button><button class="jbtn" id="vset">Voice settings</button><button class="jbtn" id="teach">For teachers: Florida standards</button><span style="font-size:14px;color:#cfc4ac">Best with headphones.</span></div>
 <div class="missions">${MIS.map((m,i)=>`<div class="mc"><span class="yr">Mission ${i+1} · ${m.year}</span><h3>${m.title}</h3><span style="font-size:14px;color:#cfc4ac">${m.place}</span><p>${m.blurb}</p>${done[m.id]?`<span class="done">Played · <span class="stars" aria-label="${(BADGE[m.id]||[]).length} of 4 badges">${stars(m.id)}</span></span>`:""}<button class="go" data-m="${i}">Play</button></div>`).join("")}</div>
 <div class="note"><b>Before you play:</b> these missions deal with slavery, the Holocaust, the incarceration of Japanese Americans, forced assimilation of Native Americans, child refugees and the genocide against the Tutsi in Rwanda. They contain no graphic violence. Teachers should preview each mission and discuss it with students afterward.</div></div>`;
 const tc=$("tc").getContext("2d");tc.scale(2,2);
 const g=tc.createLinearGradient(0,0,960,0);g.addColorStop(0,"#1d3a44");g.addColorStop(.33,"#0f2228");g.addColorStop(.66,"#4a4e56");g.addColorStop(1,"#8a7a5e");tc.fillStyle=g;tc.fillRect(0,0,960,380);
 for(let i=0;i<40;i++)circ(tc,(i*173)%960,(i*61)%160,i%6?1:1.6,"#e8e2cf88");
 tc.fillStyle="#0a191c";tc.fillRect(0,320,960,60);tc.strokeStyle="#f2b45a";tc.lineWidth=3;tc.beginPath();tc.moveTo(40,330);tc.lineTo(920,330);tc.stroke();
 MIS.forEach((m,i)=>{const x=110+i*(740/(MIS.length-1));tc.fillStyle="#f2b45a";circ(tc,x,330,7,"#f2b45a");person(tc,x,318,P[m.player],{dir:1,s:2});tc.fillStyle="#efe4cc";tc.font="22px 'IM Fell English',Georgia";tc.textAlign="center";tc.fillText(m.year,x,364);tc.font="italic 15px Georgia";tc.fillStyle="#f2b45a";tc.fillText(m.title,x,150+(i%2)*24)});
 tc.fillStyle="#efe4cc";tc.font="40px 'IM Fell English',Georgia";tc.textAlign="left";tc.fillText("Step Into History",28,56);
 $("title").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>start(+b.dataset.m));
 $("sndT").onclick=sndToggle;$("voT").onclick=voToggle;$("vset").onclick=voiceSettings;voLabel();$("teach").onclick=teachers;sndLabel();AU.scene("title");
}
function start(i){
 AU.init();M=MIS[i];G=fresh(M);G.replay=!!done[M.id];AU.scene(M.start);
 $("title").classList.add("hide");$("end").classList.add("hide");$("play").classList.remove("hide");
 obj(...M.first);bars();
 $("pF").classList.toggle("hide",!M.stealth);$("pH").classList.toggle("hide",!M.stealth);
 $("keys").innerHTML=`Keyboard: <b>← →</b> or <b>A D</b> walk · <b>Space</b> or <b>↑</b> jump · <b>E</b> talk · <b>1 2 3</b> choose${M.stealth?" · hold <b>↓</b> hide · <b>F</b> throw / break free":""} · <b>M</b> sound · <b>V</b> voices`;
 running=true;last=performance.now();requestAnimationFrame(loop);scrollTo({top:0});
 setTimeout(async()=>{await say("narr",M.warn);await say("narr",M.intro)},400);
}
function ending(){
 VO.stop();running=false;AU.scene("end");done[M.id]=1;try{localStorage.setItem("hist-done",JSON.stringify(done))}catch(e){}
 const e=M.ending(),i=MIS.indexOf(M),nx=MIS[i+1];
 const bd=[["Explorer","Found every hidden artifact",artsTotal()>0&&G.arts.length>=artsTotal()],["Listener","Talked with nearly everyone",G.talked.length>=Math.ceil(talkTotal()*.8)],["Researcher","Opened the journal to read the sources",!!G.read],["Second look","Played this mission more than once to try other choices",G.replay]];
 BADGE[M.id]=[...new Set([...(BADGE[M.id]||[]),...bd.filter(b=>b[2]).map(b=>b[0])])];try{localStorage.setItem("hist-badges",JSON.stringify(BADGE))}catch(err){}
 const pathHTML=G.path.length?`<h2 style="font-size:30px;margin:24px 0 4px">Your path</h2><p>Every choice had a consequence. Here are yours, and the idea behind each.</p><ol class="path">${G.path.map(x=>`<li>${x[0]}<small>Why it matters: ${x[1]}</small></li>`).join("")}</ol>`:"";
 const badgeHTML=`<h3 style="font-size:24px;margin:18px 0 0">Badges <span class="stars">${stars(M.id)}</span></h3><div class="badges">${bd.map(b=>`<div class="badge ${(BADGE[M.id]||[]).includes(b[0])?"":"off"}"><b>${(BADGE[M.id]||[]).includes(b[0])?"★":"☆"} ${b[0]}</b>${b[1]}</div>`).join("")}</div><p style="font-size:15px">Artifacts found: ${G.arts.length} of ${artsTotal()}.</p>`;
 $("play").classList.add("hide");$("end").classList.remove("hide");
 $("end").innerHTML=`<div class="paper"><span style="color:var(--lamp)">Mission ${i+1} · ${M.title} · ${M.year}</span><h2 style="font-size:clamp(30px,4vw,44px);margin:4px 0 10px;line-height:1.05">${e.title}</h2>${e.paras.map(p=>`<p>${p}</p>`).join("")}${pathHTML}${badgeHTML}
 <h2 style="font-size:30px;margin:24px 0 4px">What really happened</h2>
 <div class="cards">${e.cards.map(c=>`<div class="card"><h3>${c[0]}</h3>${c[1]}</div>`).join("")}</div>
 <h3 style="font-size:24px;margin:10px 0 6px">Discuss</h3><ol class="q">${e.discuss.map(q=>`<li>${q}</li>`).join("")}</ol>
 <h3 style="font-size:24px;margin:18px 0 0">Florida standards (CPALMS) in this mission</h3><table class="std">${M.standards.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`).join("")}</table>
 <p style="margin-top:20px;font-style:italic;color:var(--muted)">Our mission: to teach historical empathy to students and to people everywhere.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">${nx?`<button class="go" id="next">Next: ${nx.title} (${nx.year})</button>`:""}<button class="jbtn ink" id="again">Play this mission again</button><button class="jbtn ink" id="menu">All missions</button><button class="jbtn ink" id="ej">Open journal (${G.j.length} sources)</button></div></div>`;
 if(nx)$("next").onclick=()=>start(i+1);$("again").onclick=()=>start(i);$("menu").onclick=title;$("ej").onclick=openJ;scrollTo({top:0});
}
const dr=$("drawer");
function openJ(){if(G)G.read=1;$("dt").textContent="Journal";$("jlist").innerHTML=`<p style="margin:4px 0;font-size:14px;color:var(--muted);font-style:italic">Primary sources and historical notes you collected.</p>`+(G.j.length?G.j.map(id=>{const s=SRC[id];return `<div class="src"><h3>${s.t}</h3><div class="k">${s.k}</div>${s.q?`<blockquote>${s.q}</blockquote>`:""}<p>${s.p}</p></div>`}).join(""):"<p>No sources yet.</p>");dr.classList.add("on");$("closeJ").focus()}
function teachers(){$("dt").textContent="For teachers";$("jlist").innerHTML=`<p style="font-size:17px;font-family:'IM Fell English',Georgia,serif"><b>Our mission:</b> to teach historical empathy to students and to people everywhere.</p><p style="font-size:15px">Historical empathy means understanding why people in the past made the choices they did, in their own time, with what they knew, rather than judging them only by today's knowledge. Each mission is about 15–20 minutes. Missions are aligned to Florida's Next Generation Sunshine State Standards for Social Studies (CPALMS), grades 9–12, and support the Holocaust education requirement in s. 1003.42, F.S. Mission 5 extends that study to a later genocide. Fictional characters are clearly identified; real people's dialogue is invented and labeled. Preview each mission before class.</p>`+MIS.map((m,i)=>`<div class="src"><h3>Mission ${i+1}: ${m.title} (${m.year})</h3><div class="k">${m.warn}</div><table class="std">${m.standards.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`).join("")}</table></div>`).join("");dr.classList.add("on");$("closeJ").focus()}
$("jb").onclick=openJ;$("closeJ").onclick=()=>dr.classList.remove("on");dr.onclick=e=>{if(e.target===dr)dr.classList.remove("on")};
$("sndH").onclick=sndToggle;$("voH").onclick=voToggle;$("vsetH").onclick=voiceSettings;
$("rst").onclick=async()=>{if(G.paused||dlgRes)return;const a=await say("narr","Go back to the mission list? Your progress in this mission will be lost.",["Yes, go back","Keep playing"]);if(a===0){G.hideT=false;$("pH").classList.remove("on");title()}};
addEventListener("pointerdown",()=>{AU.init();AU.scene($("title").classList.contains("hide")?($("end").classList.contains("hide")?G.lvl:"end"):"title")},{once:true});
M=MIS[0];G=fresh(M);title();
if(location.protocol==="file:")window.__dbg={get G(){return G},go,start,get M(){return M}};
}
</script>
