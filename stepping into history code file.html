const RSCRIPT=[["1 The Witness", "narr", "", "This mission deals with the Atlantic slave trade and the Middle Passage. You explore an empty slave ship; no captives or violence are shown. The captives' experience is told in Olaudah Equiano's own words.", "15sm9zt"], ["1 The Witness", "narr", "", "Providence, Rhode Island. September 1797. You are Peter Gardner, fifteen, a free Black apprentice to a sailmaker. Rhode Island and the United States have both banned their ships from the slave trade. Some merchants do it anyway.", "t55o8g"], ["1 The Witness", "narr", "", "After dark, the Hope's crew is ashore. Only the night watchman is aboard, with his lantern.", "1qnct4f"], ["1 The Witness", "narr", "", "Stay out of the watchman's lantern light. Hold ↓ (Hide) behind the crates when he turns toward you. The hatch to the hold is at the far end.", "amr1n1"], ["1 The Witness", "narr", "", "Iron shackles, bolted to the beams in rows. The ceiling is so low you can't stand up straight. You think of the words of Olaudah Equiano.", "lgshmw"], ["1 The Witness", "narr", "", "\"…so crowded that each had scarcely room to turn himself…\"", "wa2e8k"], ["1 The Witness", "narr", "", "Water casks. Far more than a small crew could ever drink, and huge iron cooking pots. This ship was fitted to feed hundreds of people.", "1yyw0po"], ["1 The Witness", "narr", "", "Small marks scratched into a plank, in rows. You will never know who made them, or why.", "1fj6e1d"], ["1 The Witness", "narr", "", "The air is close and sour, even empty. You have to stoop to walk.", "1ys14t3"], ["1 The Witness", "moses", "Moses Brown", "Whatever happens today, Peter, the law itself is on trial.", "w2j03p"], ["1 The Witness", "moses", "Moses Brown", "The Hope lies at the end of the wharf. Find proof of where she has been.", "1e2nniq"], ["1 The Witness", "moses", "Moses Brown", "Peter. Thee knows the ship Hope? She belongs to my own brother, John.", "1at35f2"], ["1 The Witness", "moses", "Moses Brown", "We believe she carried Africans to Havana last year. The law forbids it, but the court needs proof. Will thee help?", "1w54jsx"], ["1 The Witness", "moses", "Moses Brown", "Because every soul is made in God's image. And because I once held people in bondage myself, and freed them.", "14pxlnm"], ["1 The Witness", "amos", "Prince Amos, sailmaker", "Careful, Peter. John Brown is the richest man in Providence. A Black boy who crosses him…", "1j4wacz"], ["1 The Witness", "amos", "Prince Amos, sailmaker", "I sailed on ships like that once, as crew. Look below deck, at the beams and the water casks. Wood remembers.", "11kn5ks"], ["1 The Witness", "amos", "Prince Amos, sailmaker", "Then be smart about it. Firsthand proof. Not gossip.", "18e3mhz"], ["1 The Witness", "hazard", "A sailor", "Told you, I know nothing.", "1nm6og6"], ["1 The Witness", "hazard", "A sailor", "Hope? Never heard of her.", "1t32cu0"], ["1 The Witness", "narr", "", "He pockets the coin and tells you a story about mermaids.", "ssx8f"], ["1 The Witness", "narr", "", "The shipping notice: ARRIVED, ship HOPE, from HAVANA.", "ekhhcr"], ["1 The Witness", "narr", "", "Up on the post: ARRIVED, ship HOPE, from HAVANA, with sugar and molasses. Havana is one of the busiest slave markets in the Americas.", "1p55pq0"], ["1 The Witness", "carr", "Sam Carr, sailor", "I've said what I'll say.", "1aubjo8"], ["1 The Witness", "carr", "Sam Carr, sailor", "I sailed on her. I don't want to talk about it.", "q7eqog"], ["1 The Witness", "carr", "Sam Carr, sailor", "Then let the law find me. Get away from me, boy.", "57xvup"], ["1 The Witness", "narr", "", "You sit together and watch the water. After a long time, he speaks.", "721mir"], ["1 The Witness", "carr", "Sam Carr, sailor", "From the African coast to Havana. Two hundred and more of them below. I hear them at night still. I'll tell the court.", "1mcqald"], ["1 The Witness", "narr", "", "The chest where the captain's log is kept.", "1lkka0s"], ["1 The Witness", "narr", "", "A locked sea chest. The captain's log must be inside.", "utk8j2"], ["1 The Witness", "narr", "", "The lock gives. You take the log under your coat.", "1jsmdtb"], ["1 The Witness", "narr", "", "Tomorrow the marshal can seize it legally, with a warrant.", "mas4rx"], ["1 The Witness", "johnb", "John Brown", "My brother's friends. You would ruin honest Rhode Island trade over the scruples of a few Quakers.", "kcsour"], ["1 The Witness", "narr", "", "You take the stand. What will you tell the court?", "mngtxm"], ["1 The Witness", "narr", "", "The judge stops you: Sam Carr must tell his own story. Luckily, he is here to testify.", "gv2bzb"], ["1 The Witness", "narr", "", "Build your evidence board: choose up to 3 pieces to show the court.", "ve7bbf"], ["1 The Witness", "narr", "", "The sailor you paid told the watchman someone was asking questions. Tonight there are two watchmen.\n\nWhy it matters: Paying for information can alert the people you are investigating. Investigators, like historians, have to protect their sources and their work.", "1claz0o"], ["1 The Witness", "narr", "", "You learned nothing true, and the sailor now knows someone is asking about the Hope.\n\nWhy it matters: A paid witness is worth little in court, and loose talk on the waterfront can warn the people you are investigating.", "xa7i1p"], ["1 The Witness", "narr", "", "Sam Carr refuses to testify. Your case loses its eyewitness.\n\nWhy it matters: Witnesses to the slave trade risked their jobs and safety by speaking. Pressure rarely works; trust does.", "1pcwqb"], ["1 The Witness", "narr", "", "You have the log, but you took it illegally.\n\nWhy it matters: Courts can refuse evidence that was taken unlawfully. The rule protects everyone, even people we believe are guilty.", "7m4ey8"], ["1 The Witness", "narr", "", "The marshal will seize the log legally.\n\nWhy it matters: Following the law's own process makes evidence hard to attack.", "b3347i"], ["1 The Witness", "narr", "", "The log stays locked away. The court will never see it.\n\nWhy it matters: Many important records are never found. That is why historians search so many different kinds of sources.", "17imqno"], ["1 The Witness", "peter", "Peter Gardner (you)", "\"The people in that hold were not trade.\"", "19dga24"], ["2 The Conductor", "narr", "", "This mission deals with slavery, racism, the threat of violence and family separation. It contains no graphic violence.", "1jwlz2a"], ["2 The Conductor", "narr", "", "Wilmington, Delaware. October 1851. You are Samuel Reed, sixteen, the free son of a blacksmith. Mr. Garrett has asked to see you.", "1kcl88a"], ["2 The Conductor", "hall", "Mrs. Hall", "Evening, Samuel. Mr. Garrett's been asking for you. Something about \"parcels.\"", "pb27zx"], ["2 The Conductor", "lucy", "Aunt Lucy", "You look like a boy with somewhere to be. Go see Mr. Garrett first.", "i3pi44"], ["2 The Conductor", "lucy", "Aunt Lucy", "Go on, now.", "amnco7"], ["2 The Conductor", "lucy", "Aunt Lucy", "Horehound and honey, for a cough. Don't tell me why you need it.", "1r03yz5"], ["2 The Conductor", "carney", "Mr. Carney, baker", "Bread's a penny. Unless Mr. Garrett's paying.", "yybmxa"], ["2 The Conductor", "carney", "Mr. Carney, baker", "I never saw you.", "1w3i0b4"], ["2 The Conductor", "carney", "Mr. Carney, baker", "Paid for already. Mr. Garrett's orders. I never saw you.", "1yhjgdm"], ["2 The Conductor", "narr", "", "\"$300 REWARD.\" A woman, Rachel. Her boy, Joe. A young man, Daniel, scar on the left hand.", "bpncnq"], ["2 The Conductor", "garrett", "Thomas Garrett", "The Hollis barn, after dark. \"A friend with friends.\" Go with care, Samuel.", "1ik1swr"], ["2 The Conductor", "garrett", "Thomas Garrett", "Samuel. Three travelers came up from Maryland last night. A mother, her small boy, and a young man.", "15cakj8"], ["2 The Conductor", "garrett", "Thomas Garrett", "Will thee guide them to the Kennett farm tonight?", "1p3ham7"], ["2 The Conductor", "garrett", "Thomas Garrett", "For me, a fine and jail. For thee, worse. There are men who'd sell thee south, papers or no.", "epxg9n"], ["2 The Conductor", "garrett", "Thomas Garrett", "Thee can still say no.", "4hke1s"], ["2 The Conductor", "garrett", "Thomas Garrett", "They're in the Hollis barn by the creek. Say \"A friend with friends.\" Take this blanket. The boy is coughing.", "133ttci"], ["2 The Conductor", "catcher", "The slave catcher", "You, boy. Seen a woman with a little one? Young buck with a scar on his hand? Three hundred dollars.", "llzsap"], ["2 The Conductor", "catcher", "The slave catcher", "Well?", "1ni7zlq"], ["2 The Conductor", "narr", "", "He watches you all the way down the street.", "d126qc"], ["2 The Conductor", "catcher", "The slave catcher", "Obliged, boy.", "x2qm5n"], ["2 The Conductor", "narr", "", "You memorize every word. Scar, left hand.", "1li3d9b"], ["2 The Conductor", "father", "Elias Reed, your father", "Mr. Garrett sent word he needs you. Go on.", "1lovmor"], ["2 The Conductor", "father", "Elias Reed, your father", "You're quiet tonight. Garrett sent for you, didn't he?", "j82826"], ["2 The Conductor", "father", "Elias Reed, your father", "Your grandmother bought her freedom with twenty years of washing. I won't stop you.", "tupvbp"], ["2 The Conductor", "father", "Elias Reed, your father", "I'll take the wagon up the creek road tonight. Find me past the old mill.", "e9gi41"], ["2 The Conductor", "father", "Elias Reed, your father", "Hm. Be home for breakfast.", "1iytr8c"], ["2 The Conductor", "narr", "", "You whisper the words. A young man drops from the loft, a stick in his hand.", "189c9cz"], ["2 The Conductor", "daniel", "Daniel", "Who sent you?", "dsrz76"], ["2 The Conductor", "narr", "", "Daniel's grip tightens. Rachel pulls Joe back into the dark.", "4pepn2"], ["2 The Conductor", "rachel", "Rachel", "This is Joe. Three days coughing. When he coughs, I hold my hand over his mouth.", "clkzmj"], ["2 The Conductor", "daniel", "Daniel", "Four people together is easy to see. I could go alone.", "1jez1c8"], ["2 The Conductor", "daniel", "Daniel", "Then I'll see you in freedom, Samuel.", "dfvzov"], ["2 The Conductor", "narr", "", "Stay out of the lanterns. Hold ↓ (Hide) in a bush to hide everyone; it also calms Joe's cough. Press F (Throw) to toss a stone and draw a patrol away. If a patrol grabs you, tap F fast to break free.", "8xjjj1"], ["2 The Conductor", "father", "Elias Reed, your father", "Under the straw, all of you. Iron goes on top.", "skzdm6"], ["2 The Conductor", "hannah", "Hannah Pierce", "Thee must be Samuel. Come in, all of you, quickly.", "51l2di"], ["2 The Conductor", "rachel", "Rachel", "This isn't the end of it, is it?", "1q2kk73"], ["2 The Conductor", "narr", "", "Tomorrow they go on to William Still in Philadelphia. After the fight at Christiana last month, even Pennsylvania isn't safe.", "15ggza8"], ["2 The Conductor", "narr", "", "You stayed out of trouble, but he noticed you.\n\nWhy it matters: Under the Fugitive Slave Act, slave catchers had legal power and rewards. Even silence could draw suspicion to a free Black teenager.", "bywl6z"], ["2 The Conductor", "narr", "", "He believes you, for now. When he finds nothing in New Castle, he'll come back angry, and tonight's patrols will be sharper.\n\nWhy it matters: Misleading a slave catcher was a federal crime. Every act of resistance carried a cost, sometimes later.", "vkx788"], ["2 The Conductor", "narr", "", "You know exactly who they are hunting. You'll lend Daniel your gloves to hide his scar; the patrols will need longer to recognize him.\n\nWhy it matters: Runaway ads described people in detail so anyone could identify them. Conductors studied them too.", "uefisk"], ["2 The Conductor", "narr", "", "Your father is part of it now. His wagon will be waiting past the old mill to carry everyone past the worst patrols.\n\nWhy it matters: Families shared the danger. Telling someone could bring help, and also made them legally guilty.", "1srewbo"], ["2 The Conductor", "narr", "", "Your father stays safe because he doesn't know. You'll make the whole trip on foot.\n\nWhy it matters: Many conductors kept secrets even from family, to protect them.", "qbxhyb"], ["2 The Conductor", "narr", "", "They don't trust you. Tonight they'll follow slowly and lag behind.\n\nWhy it matters: Freedom seekers were betting their lives on strangers. Trust had to be earned.", "eac533"], ["2 The Conductor", "narr", "", "Daniel goes alone. One fewer person to hide, but you may never know what happens to him.\n\nWhy it matters: Freedom seekers made their own decisions about routes and risks. They were not passengers.", "19zq9ft"], ["2 The Conductor", "narr", "", "Daniel stays. Four people are harder to hide, but no one is alone.\n\nWhy it matters: Traveling together meant shared strength and shared risk.", "1j2ls6r"], ["2 The Conductor", "sam", "Samuel Reed (you)", "\"Saw some folks heading south, to New Castle.\"", "run2fy"], ["2 The Conductor", "sam", "Samuel Reed (you)", "\"Can I read your poster?\"", "yfr1u8"], ["2 The Conductor", "sam", "Samuel Reed (you)", "\"A friend with friends.\"", "11hxrko"], ["2 The Conductor", "sam", "Samuel Reed (you)", "\"No time. We go now.\"", "xk0126"], ["2 The Conductor", "sam", "Samuel Reed (you)", "\"Your choice, Daniel.\"", "i4vxth"], ["2 The Conductor", "sam", "Samuel Reed (you)", "\"Stay with us. We're stronger together.\"", "lfq8p5"], ["2 The Conductor", "sam", "Samuel Reed (you)", "\"No, ma'am. But it's farther than yesterday.\"", "11mwf7f"], ["4 The Archive", "narr", "", "This mission deals with the Holocaust: persecution, hunger and mass deportation to a killing center. It shows no violence and does not depict the camps. You cannot win and no one is \"saved\" by your choices; you decide what to record. Pair it with survivor testimony.", "16lkvxr"], ["4 The Archive", "narr", "", "Warsaw, occupied Poland. Winter 1941. You are Hana Rozen, sixteen. Since November 1940 the Germans have sealed the city's Jews behind the ghetto wall: more than 400,000 people, starving and crowded.", "1u655z5"], ["4 The Archive", "narr", "", "A German decree: Jews found outside the ghetto without permission will be punished by death. You fold it carefully.", "1l5u8ii"], ["4 The Archive", "narr", "", "Posters in German and Polish announce \"resettlement to the East.\" Thousands are being marched to the Umschlagplatz every day. The streets are emptying.", "itr5gp"], ["4 The Archive", "halpern", "Mr. Halpern, teacher", "Take one of the posters, Hana. They must be in the archive too.", "gvi4gs"], ["4 The Archive", "halpern", "Mr. Halpern, teacher", "They are taking thousands a day. We bury the archive now. The school cellar, Nowolipki 68.", "xdmwpg"], ["4 The Archive", "narr", "", "On July 22, 1942, the Germans began the deportations. No one is told the truth about where the trains go.", "1p2t9g3"], ["4 The Archive", "halpern", "Mr. Halpern, teacher", "Everything, Hana. Papers, tickets, posters, people's own words.", "1mvx2bk"], ["4 The Archive", "halpern", "Mr. Halpern, teacher", "Hana. You have sharp eyes. Some of us are collecting everything that happens here, in secret. We call it Oneg Shabbat.", "fb80wk"], ["4 The Archive", "halpern", "Mr. Halpern, teacher", "If none of us survive, the papers will speak for us. Will you help?", "dm16rp"], ["4 The Archive", "halpern", "Mr. Halpern, teacher", "Because one day the world will ask what happened here. And the Germans will not tell the truth.", "y5ukhn"], ["4 The Archive", "narr", "", "The class goes on, quietly.", "c2bsut"], ["4 The Archive", "narr", "", "In a back room, a dozen students study poetry and mathematics. Schools are forbidden here. Learning anyway is a kind of resistance.", "10qhw7q"], ["4 The Archive", "narr", "", "They write all afternoon: about hunger, about their families, about what they want to be.", "1hugjy4"], ["4 The Archive", "narr", "", "For an hour, the ghetto disappears. Then you go back out into the cold.", "1xgh4kw"], ["4 The Archive", "cook", "Soup kitchen volunteer", "One bowl each. Some days there is nothing.", "v1nwri"], ["4 The Archive", "cook", "Soup kitchen volunteer", "The house committee runs this kitchen. One bowl each. Take a ticket; it's all we have to give the archive.", "1sncseg"], ["4 The Archive", "feld", "Mrs. Feld", "Thank you for listening.", "18tv711"], ["4 The Archive", "feld", "Mrs. Feld", "…", "mciec4"], ["4 The Archive", "feld", "Mrs. Feld", "We came from a small town to the west. They gave us twenty minutes to leave our home.", "qwg76j"], ["4 The Archive", "narr", "", "She sees your pencil racing and stops halfway. You have part of her story.", "1ss6nyb"], ["4 The Archive", "feld", "Mrs. Feld", "My husband's name was Aron. He made violins. Write that he made violins.", "1ofccnz"], ["4 The Archive", "szmulek", "Szmulek", "Not now.", "1nor99j"], ["4 The Archive", "szmulek", "Szmulek", "I go under the wall twice a day. Potatoes, mostly. My mother can't walk anymore.", "p92b20"], ["4 The Archive", "narr", "", "He eats it in four bites, then hands you something from his pocket.", "1ps2sfd"], ["4 The Archive", "szmulek", "Szmulek", "A candy wrapper, from the other side. Put it in your archive. Proof the world is still there.", "q0vhie"], ["4 The Archive", "youth", "Ruth, youth movement", "…", "edt2n4"], ["4 The Archive", "youth", "Ruth, youth movement", "Our movement's newspaper. We print it in a cellar. Read it, then hide it.", "3uzpgq"], ["4 The Archive", "halpern", "Mr. Halpern, teacher", "Ten tin boxes, and not much room. Choose what goes in. Choose carefully, Hana.", "uraqrw"], ["4 The Archive", "halpern", "Mr. Halpern, teacher", "Write your own testament too. One line. What do you want them to know?", "1xn7ktz"], ["4 The Archive", "narr", "", "You seal the box and push it into the hollow in the cellar wall. Bricks and earth go over it. Upstairs, the street is silent.", "1rsjztj"], ["4 The Archive", "narr", "", "What goes into the box? Choose up to 5.", "1cnea0l"], ["4 The Archive", "narr", "", "The students' own words will go into the archive.\n\nWhy it matters: The archive deliberately collected children's and ordinary people's voices, not only official papers.", "ue48nm"], ["4 The Archive", "narr", "", "You stayed for the lesson and learned something forbidden.\n\nWhy it matters: Secret schools were unarmed resistance: refusing to let the Nazis take away learning, culture and the future.", "3ww3jx"], ["4 The Archive", "narr", "", "You rushed, and she stopped. You have only part of her story.\n\nWhy it matters: Collecting testimony takes patience and respect. Rushing a witness can lose the truth.", "xpcy8t"], ["4 The Archive", "narr", "", "Because you listened first, she told you her husband's name and his work.\n\nWhy it matters: Testimony turns statistics into people. That was the archive's purpose.", "1jinuj8"], ["4 The Archive", "narr", "", "You gave away your only bread today.\n\nWhy it matters: In the ghetto, sharing food was a life-and-death choice. Small acts of solidarity were everywhere.", "1r3dzg4"], ["4 The Archive", "hana", "Hana Rozen (you)", "\"I want the world to know we were here.\"", "1hcsp8k"], ["4 The Archive", "hana", "Hana Rozen (you)", "\"Remember my mother's name: Sara Rozen.\"", "ymik5r"], ["4 The Archive", "hana", "Hana Rozen (you)", "\"We did not stop learning, even here.\"", "1bz87b1"], ["5 Behind the Wire", "narr", "", "This mission deals with the forced removal and incarceration of Japanese Americans, racism and family conflict. It contains no violence.", "1gs8xbr"], ["5 Behind the Wire", "narr", "", "Bainbridge Island, Washington. March 24, 1942. You are Mae Ishida, fifteen. Your parents came from Japan; you and your brother Tom were born here, so you are American citizens. Since Pearl Harbor, Japanese-born neighbors have had to turn in their cameras and radios.", "1j6c0j1"], ["5 Behind the Wire", "betty", "Betty, your classmate", "I'll save your desk in class. You'll come back, right?", "ycugbj"], ["5 Behind the Wire", "narr", "", "Under armed guard, 227 Islanders board the ferry. Neighbors and classmates line the road. Some are crying. Then a train south, for days.", "8kw3l7"], ["5 Behind the Wire", "narr", "", "Manzanar, in California's Owens Valley. About 10,000 people will be held here, behind barbed wire and guard towers. The wind never seems to stop.", "fgk7jn"], ["5 Behind the Wire", "soldier", "Soldier", "Block 3. Keep moving, miss.", "i5etou"], ["5 Behind the Wire", "soldier", "Soldier", "Family number? Ishida… Block 3, Barracks 1, Apartment 2. Mattress ticks are over by the straw pile.", "a23hox"], ["5 Behind the Wire", "narr", "", "Your mattress is as full as it will get.", "1hbx3zi"], ["5 Behind the Wire", "narr", "", "You stuff a cloth sack with straw. That's your mattress. It pokes through the cloth all night.", "mjihtw"], ["5 Behind the Wire", "mama", "Mama", "We'll make it a home. Somehow.", "1cylk6x"], ["5 Behind the Wire", "mama", "Mama", "One room for the four of us. A bulb, a stove, army cots, and dust coming through every crack in the floor.", "z82zgn"], ["5 Behind the Wire", "tom", "Tom Ishida", "Same line, same food.", "da0izl"], ["5 Behind the Wire", "tom", "Tom Ishida", "Three hundred people, one mess hall, one line, three times a day. The kids are already eating with their friends instead of their families.", "13z0w7a"], ["5 Behind the Wire", "narr", "", "The latrines have rows of toilets with no walls between them. Mama, and many of the older women, wait until late at night to use them.", "6887vx"], ["5 Behind the Wire", "soldier", "Soldier", "Back from the fence, miss.", "inhcoq"], ["5 Behind the Wire", "soldier", "Soldier", "Stay back from the fence, miss. Those are orders.", "1o1od8l"], ["5 Behind the Wire", "soldier", "Soldier", "…I just do what they tell me, miss. Step back.", "pu7365"], ["5 Behind the Wire", "narr", "", "Beyond the wire, the Sierra Nevada rises white with snow. It's beautiful. You hate that it's beautiful.", "9arvil"], ["5 Behind the Wire", "teacher", "Miss Ward, teacher", "Class starts at eight.", "1nb0j8k"], ["5 Behind the Wire", "teacher", "Miss Ward, teacher", "School will meet in this barrack. No desks, no books yet. Tomorrow we start every day the same way: the Pledge of Allegiance.", "1rd22yn"], ["5 Behind the Wire", "narr", "", "That night you write your first letter to the Bainbridge Review.", "13xo0bp"], ["5 Behind the Wire", "narr", "", "Eleven months behind barbed wire in the desert. Dust gets into everything. Now the government has a questionnaire for every adult.", "15nqwfg"], ["5 Behind the Wire", "narr", "", "Civilian Exclusion Order No. 1.", "1ere4h7"], ["5 Behind the Wire", "narr", "", "CIVILIAN EXCLUSION ORDER No. 1. All persons of Japanese ancestry, aliens and non-aliens, must leave Bainbridge Island by noon, March 30.", "127xy77"], ["5 Behind the Wire", "soldier", "Soldier", "Six days, miss. Only what you can carry.", "1860acc"], ["5 Behind the Wire", "lind", "Mr. Lindquist, neighbor", "I'll do what I can.", "1eho8j6"], ["5 Behind the Wire", "lind", "Mr. Lindquist, neighbor", "Mae. I'm sorry. I can look after the strawberries till you're back, if your father wants.", "1ku12wn"], ["5 Behind the Wire", "woodward", "Walt Woodward, editor", "Write to us. We'll print it.", "1pj6kdv"], ["5 Behind the Wire", "woodward", "Walt Woodward, editor", "We printed that this is wrong, and we'll keep printing it. Write to us from wherever they send you, Mae. Your neighbors should hear from you.", "1wzvv6v"], ["5 Behind the Wire", "mama", "Mama", "It's done, Mae. Whatever we left, we left.", "i4il2v"], ["5 Behind the Wire", "mama", "Mama", "One suitcase each. The rest we sell, store, or leave.", "ex0o95"], ["5 Behind the Wire", "mama", "Mama", "No bedding? No warm clothes? Mae, they said the camp may be cold. I'll squeeze some into mine.", "1dt2owm"], ["5 Behind the Wire", "papa", "Papa", "Go help your mother.", "6a9046"], ["5 Behind the Wire", "narr", "", "Papa is feeding letters and photographs from Japan into the stove. People say anything in Japanese can be called proof of disloyalty.", "1skdick"], ["5 Behind the Wire", "papa", "Papa", "It's only paper, Mae.", "r4gcex"], ["5 Behind the Wire", "papa", "Papa", "I know. That is why it hurts.", "1n9ycfh"], ["5 Behind the Wire", "tom", "Tom Ishida", "Six days.", "1tf6ub0"], ["5 Behind the Wire", "tom", "Tom Ishida", "I was going to enlist. I'm an American. And they're shipping us off like criminals.", "18aneiq"], ["5 Behind the Wire", "kenji", "Kenji, team captain", "Good game. Same time next week.", "j4rrk3"], ["5 Behind the Wire", "kenji", "Kenji, team captain", "Mae! We're short a batter. Camp league game. Three pitches. Hit it when the ball reaches the plate: press Space, E, or tap Jump.", "1djip5l"], ["5 Behind the Wire", "papa", "Papa", "Whatever you answer, you are my daughter.", "1dqtywn"], ["5 Behind the Wire", "papa", "Papa", "Question 28 asks me to give up all loyalty to Japan. But America will not let me become a citizen. If I say yes, I belong to no country at all.", "1042xc3"], ["5 Behind the Wire", "tom", "Tom Ishida", "I've decided.", "1gdks8i"], ["5 Behind the Wire", "tom", "Tom Ishida", "They want me to volunteer for an all-Nisei Army unit, while my family sits behind barbed wire. What do I do?", "p5ylqo"], ["5 Behind the Wire", "clerk", "Registration officer", "Talk to your family first, miss. Then come back.", "1y6z9im"], ["5 Behind the Wire", "clerk", "Registration officer", "Question 27, for women: would you volunteer for the Army Nurse Corps or the Women's Army Auxiliary Corps?", "6fljlm"], ["5 Behind the Wire", "clerk", "Registration officer", "Question 28: will you swear unqualified allegiance to the United States and forswear any allegiance to the Emperor of Japan?", "1scfe6h"], ["5 Behind the Wire", "mama", "Mama", "Good. A blanket wall. Like a real house.", "1s7v030"], ["5 Behind the Wire", "mama", "Mama", "Smart girl. Tomorrow we find scrap wood for shelves.", "1byadan"], ["5 Behind the Wire", "mama", "Mama", "Cry, Mae. Then we start.", "1qiz26p"], ["5 Behind the Wire", "tom", "Tom Ishida", "Quietly. Sure.", "duwhp3"], ["5 Behind the Wire", "tom", "Tom Ishida", "Say so to who? The soldiers?", "j71uhf"], ["5 Behind the Wire", "tom", "Tom Ishida", "…Yeah. Me too.", "1q5hri8"], ["5 Behind the Wire", "tom", "Tom Ishida", "Then I'll go. For you and Mama and Papa.", "1mjtq4m"], ["5 Behind the Wire", "tom", "Tom Ishida", "No and no. Let them send me wherever they send people like me.", "ct6k3t"], ["5 Behind the Wire", "tom", "Tom Ishida", "Yes, but I'm not volunteering. If they want me, they can draft me.", "1z0fhg7"], ["5 Behind the Wire", "tom", "Tom Ishida", "Papa will like that. He hasn't said a word since the train.", "kdusv6"], ["5 Behind the Wire", "tom", "Tom Ishida", "Yeah. Everybody's doing it. Mama won't say anything, but she'll notice.", "s71feb"], ["5 Behind the Wire", "narr", "", "Tom found scrap lumber behind the mess hall. What will you build? You have 5 pieces.", "52ncuj"], ["5 Behind the Wire", "narr", "", "What goes in your suitcase? It holds 6.", "1x5era5"], ["5 Behind the Wire", "narr", "", "You'll write to the Bainbridge Review from camp.\n\nWhy it matters: A free press that spoke up kept the island connected to its exiled neighbors, and helped many return after the war.", "1mqa0xf"], ["5 Behind the Wire", "narr", "", "You keep your grandmother's letters, even though it's risky.\n\nWhy it matters: Fear made many families destroy their own history. What survived is precious to families and historians today.", "11gkyvv"], ["5 Behind the Wire", "narr", "", "The letters and photographs burn.\n\nWhy it matters: Fear made many Japanese American families destroy letters, photographs and keepsakes. That history is gone forever.", "1yuzumz"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"I don't know.\"", "1fxav7g"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Save it for me.\"", "x83z69"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Let's still sit together, as a family.\"", "1aj5po"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"I'm going to sit with the island kids.\"", "1hl78mr"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Who are you guarding us from?\"", "qe49z3"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"With liberty and justice for all?\"", "1dn0wom"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Thank you. We'll trust you with the farm.\"", "catlxm"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Papa says we'll have to sell. We don't know if we're coming back.\"", "18vsq5w"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"I packed Grandmother's letters. I'm keeping them.\"", "uaf5fn"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Papa, stop. We did nothing wrong.\"", "1fk745d"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Then show them by going quietly.\"", "4z9gdg"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"It isn't fair, and we should say so.\"", "1v4584z"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"I'm scared too.\"", "lapidn"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Then answer however you need to, Papa.\"", "uwektb"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Say yes. We'll get through it together.\"", "tpprs3"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Go. Show them who we are.\"", "o2qlln"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Answer no-no. Don't let them use you.\"", "1wjhxsu"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Answer yes, but don't volunteer.\"", "zwzsgs"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Yes.\"", "32gnrl"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"No.\"", "1qitm1r"], ["5 Behind the Wire", "mae", "Mae Ishida (you)", "\"Yes, if my family's rights are restored.\" (a qualified answer)", "1575rfj"], ["7 The Hundred Days", "narr", "", "This mission deals with the 1994 genocide against the Tutsi in Rwanda: hate propaganda, mass killing, loss of family and hiding. No violence is shown, and your choices do not decide who lives. Teachers should preview it and pair it with survivor testimony.", "1da9a28"], ["7 The Hundred Days", "narr", "", "Kigali, Rwanda. April 6, 1994. You are Grace Uwase, fifteen. Your family is Tutsi. Your best friend's family is Hutu. You speak the same language, go to the same church and the same school. But every Rwandan's identity card names their ethnic group.", "1hw6ztr"], ["7 The Hundred Days", "narr", "", "Mama Beata hides you and Eric in a back room behind a cupboard. The ceiling is low. You learn to move without a sound.", "1f754kp"], ["7 The Hundred Days", "narr", "", "After about one hundred days, the killing stops. You step outside for the first time since April. The streets are silent.", "18nys5n"], ["7 The Hundred Days", "narr", "", "Gacaca means \"grass.\" Communities gather outdoors, and elected judges called inyangamugayo, \"people of integrity,\" hear the cases of their own neighbors.", "4eybg9"], ["7 The Hundred Days", "mamag", "Mama", "Go on, Grace. Be home before dark.", "1wcdfes"], ["7 The Hundred Days", "mamag", "Mama", "Grace, you'll need your identity card for the new school form. Here.", "1kcfegr"], ["7 The Hundred Days", "narr", "", "Your card says, under ethnic group: Tutsi. The Belgians who once ruled Rwanda made everyone carry one. You never thought much about it. Lately, you do.", "1rynxx7"], ["7 The Hundred Days", "jp", "Jean-Paul, your best friend", "See you at school tomorrow.", "wqz0yl"], ["7 The Hundred Days", "jp", "Jean-Paul, your best friend", "My uncle says Tutsi are planning to take over the country. He hears it on the radio every day.", "1gaqsy8"], ["7 The Hundred Days", "shop", "The shopkeeper", "Turn it down? Everyone listens to RTLM.", "a85481"], ["7 The Hundred Days", "narr", "", "The shop radio is tuned to RTLM. Between popular songs, the announcer calls Tutsi \"inyenzi\": cockroaches. He laughs. The men by the counter laugh too.", "1w9h70r"], ["7 The Hundred Days", "beata", "Mama Beata, your neighbor", "Remember what I said.", "14ebtb3"], ["7 The Hundred Days", "beata", "Mama Beata, your neighbor", "Grace. Things on that radio frighten me. If anything happens, anything, you bring Eric to me. My back room has a cupboard in front of the door.", "h565db"], ["7 The Hundred Days", "narr", "", "Mama Beata is Hutu. She has known you since you were born.", "nooh3m"], ["7 The Hundred Days", "eric", "Eric, your little brother", "Grace! Watch me kick it over the wall!", "ywc6o1"], ["7 The Hundred Days", "eric", "Eric, your little brother", "Grace, look, it's getting dark. Is it time to go home?", "12889w9"], ["7 The Hundred Days", "narr", "", "That night, the president's plane is shot down over Kigali. By morning there are roadblocks on every road, and the radio is reading out names.", "307fmb"], ["7 The Hundred Days", "mamag", "Mama", "Grace. Take Eric to Mama Beata's. Now. I will come for you when I can.", "1int1q2"], ["7 The Hundred Days", "narr", "", "The radio crackles.", "1ih5i5u"], ["7 The Hundred Days", "narr", "", "Day 12. Mama Beata keeps the radio low. A foreign station reports that the United Nations is pulling most of its peacekeepers out of Rwanda. Fewer than three hundred will stay.", "5t56iq"], ["7 The Hundred Days", "beata", "Mama Beata, your neighbor", "Eat, child. You must stay strong for Eric.", "u1gwei"], ["7 The Hundred Days", "beata", "Mama Beata, your neighbor", "Day 34. I could only find a little beans today. They watch who buys more food than they need.", "4hwm19"], ["7 The Hundred Days", "eric", "Eric, your little brother", "Tell me the story again, Grace.", "fzh4n"], ["7 The Hundred Days", "eric", "Eric, your little brother", "Day 57. I want to go outside. I want Mama.", "ovbw6q"], ["7 The Hundred Days", "narr", "", "Day 71. Boots outside. Someone pounds on the front door. Mama Beata goes to answer it.", "zpbf8n"], ["7 The Hundred Days", "narr", "", "You hold Eric against you and don't breathe.", "u9pdx9"], ["7 The Hundred Days", "narr", "", "Through the wall you hear her laugh, offer them beer, complain about her bad knee. After a long time, the door shuts. Mama Beata does not come back to the room for an hour. When she does, her hands are shaking.", "yc0eta"], ["7 The Hundred Days", "narr", "", "Day 100. In July the Rwandan Patriotic Front takes Kigali. The radio stops. Someone outside is shouting that it's over.", "fnrqq6"], ["7 The Hundred Days", "rpf", "RPF soldier", "Go carefully.", "5jpt6s"], ["7 The Hundred Days", "rpf", "RPF soldier", "Are you hurt? Is there anyone else in that house? Go carefully, the roads aren't safe yet. Look for your people at the church.", "1g6fzj2"], ["7 The Hundred Days", "neighbor", "Madame Mukamana", "I'm sorry, Grace.", "1olbwe5"], ["7 The Hundred Days", "neighbor", "Madame Mukamana", "Grace? You're alive. And Eric? Thank God.", "1qmxj27"], ["7 The Hundred Days", "neighbor", "Madame Mukamana", "Your mother… she went to the roadblock in April, to look for your uncle. She never came back. I'm so sorry.", "11un9bv"], ["7 The Hundred Days", "neighbor", "Madame Mukamana", "Men from here. Some we knew.", "1mo349c"], ["7 The Hundred Days", "narr", "", "The door is open. The house is empty. Mama's chair is still by the window.", "drn6lw"], ["7 The Hundred Days", "judge", "Gacaca judge", "Listen to the confession first.", "1pdiyt2"], ["7 The Hundred Days", "judge", "Gacaca judge", "Grace Uwase. Today the accused will speak about the roadblock in your neighborhood. Then the community, and you, may speak.", "1if881u"], ["7 The Hundred Days", "confessor", "The accused", "I have said everything.", "5vcyrq"], ["7 The Hundred Days", "narr", "", "He wears the pink uniform of a Rwandan prisoner. You know him. He used to sell you sugar.", "1ai4tt1"], ["7 The Hundred Days", "confessor", "The accused", "I stood at that roadblock. I checked identity cards. I let others do what they did. I ask this community, and this girl, for forgiveness.", "f2qi9k"], ["7 The Hundred Days", "narr", "", "Everyone is looking at you.", "14mgxze"], ["7 The Hundred Days", "beata", "Mama Beata, your neighbor", "You and Eric are grown now. That is what I prayed for, in that room.", "qbcvzl"], ["7 The Hundred Days", "jp", "Jean-Paul, your best friend", "…No. You're Grace. That's different.", "121reab"], ["7 The Hundred Days", "jp", "Jean-Paul, your best friend", "Maybe. My uncle believes it, though. Lots of people do.", "1i2dpy8"], ["7 The Hundred Days", "jp", "Jean-Paul, your best friend", "Saturday, two o'clock. Don't be late again.", "r2fdeb"], ["7 The Hundred Days", "shop", "The shopkeeper", "Change it? Girl, this is the station everyone listens to.", "bu3x9o"], ["7 The Hundred Days", "shop", "The shopkeeper", "Suit yourself.", "ns4h5x"], ["7 The Hundred Days", "shop", "The shopkeeper", "Sugar. That's all. Go home now, child.", "429s7e"], ["7 The Hundred Days", "beata", "Mama Beata, your neighbor", "…No one has seen her, Grace. I am asking. Quietly.", "g0caok"], ["7 The Hundred Days", "beata", "Mama Beata, your neighbor", "Because you are children. Because God sees what we do. Because if I don't, who will?", "ew1c9k"], ["7 The Hundred Days", "narr", "", "He giggles once, then covers his own mouth.", "py2wdo"], ["7 The Hundred Days", "narr", "", "He sleeps. You don't.", "1tewp2q"], ["7 The Hundred Days", "narr", "", "He counts to a hundred on his fingers. Then again.", "fyy6s3"], ["7 The Hundred Days", "confessor", "The accused", "…Near the old church path. I will show them where. She can be buried properly.", "7davf"], ["7 The Hundred Days", "confessor", "The accused", "I understand.", "odyijq"], ["7 The Hundred Days", "confessor", "The accused", "…Thank you.", "11wjzyu"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"Jean-Paul, I'm Tutsi. Am I planning something?\"", "d7180f"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"The radio lies.\"", "1hjyjum"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"Thank you, Mama Beata.\"", "2lvqv5"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"Nothing will happen. Will it?\"", "50f8m0"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"Come with us, Mama!\"", "16paohy"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"Have you heard anything about Mama?\"", "i0duj4"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"Why are you doing this for us?\"", "985q7r"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"Who was at the roadblock?\"", "1t9abmk"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"Tell me where my mother is buried.\"", "1jv2eez"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"I can't forgive you. Not today.\"", "1bz8qa2"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"I forgive you. I don't do it for you.\"", "3my82e"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"You saved our lives, Mama Beata.\"", "87wxv5"], ["7 The Hundred Days", "grace", "Grace Uwase (you)", "\"Never again\" again", "176r075"], ["3 The Code", "narr", "", "This mission deals with forced assimilation at Indian boarding schools, racism and World War II combat. No violence is shown; the battle is heard and seen from a radio post.", "1lz7m73"], ["3 The Code", "narr", "", "Arizona, the Navajo Nation. Autumn 1941. You are Tomas Yazzie, sixteen. At the government boarding school you must speak only English. At home, your grandmother speaks only Diné bizaad, the Navajo language.", "1vs9ogm"], ["3 The Code", "narr", "", "Your hair was cut short the day you arrived. Your Navajo name is not on any school list.", "15potfg"], ["3 The Code", "narr", "", "Twenty-nine Navajo recruits. One secret assignment: turn your language into a code no enemy can break.", "6mh67"], ["3 The Code", "narr", "", "February 1945. Black volcanic sand, smoke and the constant thunder of guns. You never see the battle the way the history books show it. You hear it, through a radio headset.", "u69oan"], ["3 The Code", "sam2", "Sam Begay, your friend", "Hurry. Mrs. Kent hates it when we're late.", "53sere"], ["3 The Code", "sam2", "Sam Begay, your friend", "Yá'át'ééh, Tomas. Did you finish the reading?", "1h34dmi"], ["3 The Code", "mrsk", "Mrs. Kent, teacher", "Go on, now.", "1jlcksj"], ["3 The Code", "mrsk", "Mrs. Kent, teacher", "Tomas. I heard you speaking Indian in the hall. You know what that means. Mouth, soap, and no supper.", "8229sw"], ["3 The Code", "mrsk", "Mrs. Kent, teacher", "Good morning, Tomas. Remember: English only. That is how you will get ahead in this world.", "14rv798"], ["3 The Code", "narr", "", "December 7, 1941: Japan attacks Pearl Harbor. By spring, the Marines are looking for young Navajo men.", "1jg9p8v"], ["3 The Code", "recruit", "Marine recruiter", "See you in San Diego, Marine.", "1rwqd6q"], ["3 The Code", "recruit", "Marine recruiter", "The Marine Corps needs Navajo men who speak both Navajo and English, fluently. Special duty. That's all I can say.", "12io3jw"], ["3 The Code", "recruit", "Marine recruiter", "Interested, son?", "16zfxgx"], ["3 The Code", "recruit", "Marine recruiter", "…I hear you, son. I can't argue with it. But your country needs you.", "1sltlg8"], ["3 The Code", "narr", "", "You're old enough to enlist, barely. Before you go, you need to tell your grandmother.", "mreb14"], ["3 The Code", "grandma", "Grandmother (Shimásání)", "You are going far away, to a war that is not ours. But you will carry our language with you. Do not lose it.", "4rmbc4"], ["3 The Code", "narr", "", "She ties a small pouch to your belt and says a prayer in Diné, so quietly you can barely hear.", "mo7bmk"], ["3 The Code", "sgt", "Sergeant", "The board's waiting, Marine.", "uuhlob"], ["3 The Code", "sgt", "Sergeant", "Listen up. You'll invent a code. Navajo words for military terms, and an alphabet. Nothing written down in the field. You memorize it all.", "1rts8ku"], ["3 The Code", "sam2", "Sam Begay, your friend", "Funny, huh? Three years of soap for speaking Navajo. Now they need us to speak it to win the war.", "113g4ea"], ["3 The Code", "narr", "", "You know the code by heart now.", "qoqw2d"], ["3 The Code", "narr", "", "Your team picks natural things a Navajo would know, so a Marine can say them fast and never forget them. Which word did the code talkers use?", "418s6m"], ["3 The Code", "narr", "", "The code is tested against Navy codebreakers. They can't even write it down, let alone break it.", "wcthwx"], ["3 The Code", "guard", "Pfc. Riley, your bodyguard", "Stay close. I've got your back.", "1svhwem"], ["3 The Code", "guard", "Pfc. Riley, your bodyguard", "Yazzie. Stick with me. Couple of guys from another unit saw you yesterday and thought you were Japanese. I told them who you are.", "5m736s"], ["3 The Code", "marine2", "A Marine", "They say the code talkers send messages faster than the machines. Is that true?", "12gj745"], ["3 The Code", "narr", "", "Messages pour in. Send each one in code, fast. Every second counts, and a mistake could send fire to the wrong place.", "dfykc6"], ["3 The Code", "narr", "", "Your radio crackles. A message comes in from the mountain. Spell it out: S-U-R-I-B-A-C-H-I.", "1xc9n13"], ["3 The Code", "narr", "", "Over the radio it comes as animals: snake, Ute, rabbit, ice, bear, ant, cat, horse, ice. What does it mean?", "1oll1o9"], ["3 The Code", "narr", "", "Yes. Marines have raised the American flag on Mount Suribachi. Cheers go up all over the beach.", "o48v7x"], ["3 The Code", "narr", "", "Listen again: it spells SURIBACHI. Marines have raised the flag on Mount Suribachi.", "r2t421"], ["3 The Code", "narr", "", "The fighting goes on for weeks. Six code talkers send and receive more than 800 messages in the first two days, without a single error.", "9ddp6f"], ["3 The Code", "grandma", "Grandmother (Shimásání)", "You came back. What did you do there, my grandson?", "j6cu3t"], ["3 The Code", "sam2", "Sam Begay, your friend", "Ha! Careful. If she hears you, it's soap again.", "1lywrmp"], ["3 The Code", "sam2", "Sam Begay, your friend", "…Right. English only.", "hk2nw4"], ["3 The Code", "narr", "", "You were punished for speaking Diné, but you kept your language.\n\nWhy it matters: Boarding schools tried to erase Native languages. Children who kept speaking them, often in secret, are why fluent speakers existed to become code talkers.", "1yiv4yo"], ["3 The Code", "narr", "", "You followed the English-only rule. Your Diné gets a little rustier each year.\n\nWhy it matters: That was the schools' goal: to replace Native languages and identities. Many families lost their languages within a generation.", "126ngr9"], ["3 The Code", "narr", "", "The recruiter has no good answer. You enlist anyway.\n\nWhy it matters: Native Americans served in World War II at high rates, out of duty to family, land and country, even as that country denied them rights.", "nhwgw7"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"English only, Sam. You know the rules.\"", "hyrm36"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"It's my grandmother's language.\"", "o8vifz"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"Yes. I'll serve.\"", "1atzizv"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"The government punished me for that language. Now it needs it?\"", "b70twf"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"I won't, Grandmother.\"", "1xc75xg"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"They told me at school to forget it.\"", "1wky3ky"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"Thanks. That happens more than you'd think.\"", "1qohans"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"Faster, and nobody's broken it yet.\"", "1fic558"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"I'm not supposed to talk about it.\"", "vj3phj"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"I can't tell you, Grandmother. It's secret.\"", "ywvwn1"], ["3 The Code", "tomas", "Tomas Yazzie (you)", "\"I used our language. Every day.\"", "14b6uqw"], ["6 Pedro Pan", "narr", "", "This mission deals with family separation, revolution and being a child refugee. It contains no violence.", "vwam42"], ["6 Pedro Pan", "narr", "", "Havana, Cuba. Summer 1961. You are Marisol Ferrer, fourteen. Two years ago, Fidel Castro's revolution took power. This spring, the United States failed to overthrow him at the Bay of Pigs. Tonight your parents have something to tell you.", "1f8fufn"], ["6 Pedro Pan", "narr", "", "Papa drives you to the airport. Nobody talks.", "dwm4b"], ["6 Pedro Pan", "narr", "", "Children leaving alone are taken into a room walled with glass. The families call it la pecera, the fishbowl. Parents can see their children, but can't touch them or hear them.", "1yfonsp"], ["6 Pedro Pan", "narr", "", "Miami. The heat feels like Havana, but nothing else does. Hundreds of boys and girls wait here for relatives, foster homes, or their parents.", "yr8sg2"], ["6 Pedro Pan", "mamap", "Mamá", "Go say goodbye to Abuela and Lucía, mi amor.", "3p84ns"], ["6 Pedro Pan", "papap", "Papá", "Marisol. Your mother and I have arranged a visa waiver for you. You will fly to Miami, alone. The Church there will care for you until we can come.", "7ksuku"], ["6 Pedro Pan", "mamap", "Mamá", "People say the government will take children away from their parents, to be raised by the state. We cannot risk it.", "yc8r12"], ["6 Pedro Pan", "abuela", "Abuela", "Ve con Dios, mi niña.", "y9yf9y"], ["6 Pedro Pan", "abuela", "Abuela", "Take this. My rosary. And this: a little bag of Cuban earth. So you don't forget where you come from.", "707g7o"], ["6 Pedro Pan", "lucia", "Lucía, your best friend", "Write to me!", "1f21ppg"], ["6 Pedro Pan", "lucia", "Lucía, your best friend", "You're leaving? I'm going to the countryside to teach peasants to read, with the literacy campaign. My parents are proud. Aren't yours?", "1p1cf6e"], ["6 Pedro Pan", "miliciano", "Militiaman", "Where are you going, young lady? The revolution needs young people here.", "12gjinx"], ["6 Pedro Pan", "miliciano", "Militiaman", "Open the suitcase. Jewelry? Money? Children can't take valuables out of the country.", "2rm79o"], ["6 Pedro Pan", "narr", "", "He holds up Abuela's rosary.", "dnvf9e"], ["6 Pedro Pan", "narr", "", "You still have the little bag of Cuban earth, hidden in your sock.", "m0ban6"], ["6 Pedro Pan", "narr", "", "Through the glass you can see Mama and Papa. Mama is trying not to cry. Papa is holding up his hand.", "sdr291"], ["6 Pedro Pan", "narr", "", "They call your flight.", "19089gz"], ["6 Pedro Pan", "walsh", "Father Walsh", "Find Rafa. He'll show you around.", "17dnb4w"], ["6 Pedro Pan", "walsh", "Father Walsh", "Bienvenida, Marisol. I'm Father Walsh. Nobody came for you at the airport, so you'll stay here at camp until we find you a family. You're safe now.", "spog06"], ["6 Pedro Pan", "rafa", "Rafa, another Pedro Pan", "Dinner's at six. Don't eat the meatloaf.", "1d0tvpu"], ["6 Pedro Pan", "rafa", "Rafa, another Pedro Pan", "First week? The first week is the worst. I cried every night. Now I just cry on Sundays.", "86yqur"], ["6 Pedro Pan", "rafa", "Rafa, another Pedro Pan", "Quick, before dinner: English challenge! I say it in Spanish, you pick the English. Ready?", "ujk1z8"], ["6 Pedro Pan", "narr", "", "A letter from Havana. Mama writes that everything is fine, which is how you know it isn't. What do you write back?", "o4uv2a"], ["6 Pedro Pan", "counselor", "Camp counselor", "Marisol, we found a family for you. In Colorado. The Hendersons. They've never met a Cuban, but they have a daughter your age.", "12xr7ar"], ["6 Pedro Pan", "foster", "Mrs. Henderson", "Hello, Marisol. We're so glad to have you. Do you like snow?", "avtbia"], ["6 Pedro Pan", "narr", "", "October 1962. The Cuban Missile Crisis. All flights between Havana and Miami stop. Operation Pedro Pan is over. Your parents are still in Cuba.", "wvwbdw"], ["6 Pedro Pan", "papap", "Papá", "We can't get out yet. Soon, God willing.", "1jtut4n"], ["6 Pedro Pan", "papap", "Papá", "A few months. Until things change. Everyone says it won't last.", "1yotyyp"], ["6 Pedro Pan", "papap", "Papá", "No one knows for sure, mi hija. That is what frightens us.", "1rg15t7"], ["6 Pedro Pan", "lucia", "Lucía, your best friend", "…Mine aren't. I guess we're on different sides now.", "108prxr"], ["6 Pedro Pan", "lucia", "Lucía, your best friend", "Me too. Promise we'll still be friends.", "vid55h"], ["6 Pedro Pan", "lucia", "Lucía, your best friend", "Nobody tells me what to think, Marisol. Not them, and not you.", "1fckduy"], ["6 Pedro Pan", "rafa", "Rafa, another Pedro Pan", "Some. You make friends. You learn English. You stop counting days.", "1uak8bv"], ["6 Pedro Pan", "rafa", "Rafa, another Pedro Pan", "Sure. Me neither.", "t0zgil"], ["6 Pedro Pan", "rafa", "Rafa, another Pedro Pan", "Okay. Lesson one: \"homesick.\" It means what you feel.", "2e5zem"], ["6 Pedro Pan", "miliciano", "Militiaman", "…Keep it. Go on.", "13k0vgb"], ["6 Pedro Pan", "miliciano", "Militiaman", "Into the box. Next!", "15jfaiy"], ["6 Pedro Pan", "narr", "", "You asked whether the rumor was true. No one could say.\n\nWhy it matters: Rumors spread fast in a crisis. Historians still study how this one shaped thousands of families' choices.", "1x8au6g"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"Then come with me!\"", "1jf8kw6"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"For how long?\"", "1v8t01s"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"Is that rumor even true?\"", "1oy31t7"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"I could never forget, Abuela.\"", "xm1u4d"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"My parents are afraid of the government.\"", "3ey8ox"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"I'll miss you, Lucía.\"", "1m75wcj"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"Don't let them tell you what to think.\"", "mu5hp8"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"Just home, compañero.\"", "k8wanm"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"Please, it's from my grandmother.\"", "1wah2ku"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"Does it get better?\"", "ara953"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"I'm not crying.\"", "2oq3f2"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"I'm happy here. Don't worry about me.\"", "fd9y79"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"When are you coming?\"", "1jzjlmp"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"What is snow?\"", "9e3zv8"], ["6 Pedro Pan", "marisol", "Marisol Ferrer (you)", "\"Gracias. Thank you.\"", "vjfw7d"]];
/* ================= sources (journal) ================= */
const SRC={
act1794:{t:"Slave Trade Act of 1794",k:"U.S. federal law, signed by George Washington, March 22, 1794",p:"Banned Americans from building, fitting out or sending ships from the United States to carry enslaved people to foreign countries. It did not end slavery or the domestic slave trade; Congress could not ban importing enslaved people into the U.S. until 1808."},
quakers:{t:"Moses Brown and the Quakers",k:"Historical figure (1738–1836)",p:"A Providence merchant who became a Quaker, freed the people he had enslaved in 1773, and pushed for Rhode Island's 1784 gradual abolition law and its 1787 ban on the slave trade. When that ban went unenforced, he helped found the Providence Abolition Society to bring lawsuits. His brother John Brown was one of the trade's loudest defenders."},
freeblack:{t:"Free Black Rhode Islanders",k:"Historical note",p:"Rhode Island had a large free Black community by the 1790s. In Newport, Black residents founded the Free African Union Society in 1780 for mutual aid. Black sailors, sailmakers and dockworkers knew the waterfront, and the slave ships, better than almost anyone."},
hope1796:{t:"The voyage of the Hope",k:"Trans-Atlantic Slave Trade Database",p:"In 1796 John Brown's ship Hope carried 229 enslaved Africans to Havana, Cuba. Behind that number were 229 people with names, families and languages that the ship's records did not bother to write down."},
equiano:{t:"Olaudah Equiano, The Interesting Narrative (1789)",k:"Primary source, published in London; widely read in America",q:"\"The closeness of the place, and the heat of the climate, added to the number in the ship, which was so crowded that each had scarcely room to turn himself, almost suffocated us.\"",p:"Equiano's memoir of the Middle Passage became a bestseller and a weapon for abolitionists. Some historians, using baptism and navy records, now question whether he was born in Africa or in South Carolina. No one questions the accuracy of his picture of the slave ship. Ask: how does that debate change how we use the source?"},
act1808:{t:"Act Prohibiting Importation of Slaves (1807)",k:"U.S. federal law, effective January 1, 1808",p:"The earliest date the Constitution allowed. It banned bringing enslaved people into the United States, but smuggling continued, and the domestic slave trade grew."},
fsa:{t:"Fugitive Slave Act of 1850",k:"U.S. federal law, signed September 18, 1850",q:"[Anyone who helps a person escape] \"shall, for either of said offences, be subject to a fine not exceeding one thousand dollars, and imprisonment not exceeding six months.\" (Section 7)",p:"The law required people in free states to help capture people who had escaped slavery. An accused person could not testify for themselves, and the commissioner deciding the case was paid $10 if he sent the person south and $5 if he set them free."},
garrett:{t:"Thomas Garrett (1789–1871)",k:"Historical figure",p:"A Quaker iron and hardware merchant in Wilmington, Delaware, and a key stationmaster on the eastern Underground Railroad. In 1848 a federal court fined him thousands of dollars for helping a family escape; he kept going. By his own estimate he helped about 2,700 people, working with Harriet Tubman and free Black Wilmingtonians."},
kidnap:{t:"Kidnapping of free Black people",k:"Historical note",p:"Free Black people, including children, were sometimes kidnapped and sold south. Solomon Northup, a free man from New York, was kidnapped in 1841 and enslaved for twelve years; his memoir Twelve Years a Slave appeared in 1853."},
ad:{t:"Runaway advertisement",k:"Recreation for this game, in the style of real ads",q:"$300 REWARD. Ran away from the subscriber, Dorchester County, Md., a WOMAN named RACHEL, about 30, and her son JOE, about 6; also a young man DANIEL, about 19, scar on the left hand.",p:"Enslavers placed ads like this across the region. Historians now use thousands of real ones as evidence. This one is invented; Rachel, Joe and Daniel are fictional."},
family:{t:"Families in the network",k:"Historical note",p:"The Underground Railroad had no membership list. It was a loose web of free Black families, churches, vigilance committees, some white abolitionists, and freedom seekers themselves. Telling a relative could bring help, but it also made them legally responsible."},
still:{t:"William Still (1821–1902)",k:"Historical figure",p:"A free Black abolitionist in Philadelphia who interviewed hundreds of freedom seekers, recorded their stories, and hid the records. He published them in 1872 as The Underground Rail Road."},
christiana:{t:"The Christiana Resistance",k:"September 11, 1851, Lancaster County, Pennsylvania",p:"A Maryland enslaver, Edward Gorsuch, came with a federal marshal to capture four men who had escaped. Black residents led by William Parker resisted; Gorsuch was killed. Dozens were charged with treason. Freedom seekers and their allies did fight back, at enormous risk."},
tubman:{t:"Harriet Tubman (c. 1822–1913)",k:"Historical figure",p:"She escaped from Dorchester County, Maryland, in 1849, then returned about 13 times and guided roughly 70 people north, by historians' estimates. Her routes often ran through Wilmington and Thomas Garrett."},
oneg:{t:"The Oneg Shabbat archive",k:"Warsaw ghetto, 1940–1943",p:"Historian Emanuel Ringelblum organized a secret archive, code-named Oneg Shabbat (\"Joy of the Sabbath\"). Its members collected underground newspapers, documents, drawings, candy wrappers, tram tickets, ration cards, posters, poems and testimonies, so that the truth of the ghetto would survive even if they did not."},
ghetto:{t:"The Warsaw ghetto",k:"Historical note",p:"In November 1940 the German occupiers sealed the Jews of Warsaw behind walls. More than 400,000 people were crowded into a small part of the city, with starvation rations. Jews from nearby towns and from Germany were deported into it as well. Jews over the age of 12 had to wear a white armband with a blue Star of David."},
spiritual:{t:"Unarmed (spiritual) resistance",k:"Historical note",p:"Not all resistance was armed. In the ghettos, people ran secret schools, prayed, made music and theater, kept diaries, and documented the truth. Holding on to dignity and culture under the Nazis' plan to destroy them was itself defiance. Armed resistance came too: the Warsaw Ghetto Uprising began on April 19, 1943."},
aleynhilf:{t:"Self-help in the ghetto",k:"Historical note",p:"The Jewish self-help organization (Aleynhilf) ran soup kitchens, refugee shelters and house committees. Ringelblum built the archive through these networks, which brought him testimonies from every corner of the ghetto."},
smuggle:{t:"Child smugglers",k:"Historical note",p:"Official food rations in the ghetto were far below what people needed to live. Smuggling kept many alive, and much of it was done by children small enough to slip through gaps in the wall. Those caught could be beaten or shot."},
testimony:{t:"Why testimony matters",k:"Historical note",p:"Most documents about the Holocaust were written by the perpetrators. Testimony, from diaries, from the archive, and from survivors after the war, tells the story from the point of view of the people the Nazis tried to erase. Survivor testimony collections include USC Shoah Foundation (IWitness) and the U.S. Holocaust Memorial Museum."},
grossaktion:{t:"The Great Deportation",k:"July 22 – September 21, 1942",p:"German SS and police units, with auxiliaries, deported about 265,000 Jews from the Warsaw ghetto to the Treblinka killing center, and killed about 35,000 more inside the ghetto. The Oneg Shabbat collected the German posters that announced the deportation."},
eo9066:{t:"Executive Order 9066",k:"Signed by President Franklin Roosevelt, February 19, 1942",p:"It let military commanders declare areas from which \"any and all persons\" could be excluded. In practice it was used against people of Japanese ancestry on the West Coast, two-thirds of whom were U.S. citizens. More than 125,000 people were incarcerated without charges or trials."},
ceo1:{t:"Civilian Exclusion Order No. 1",k:"Posted on Bainbridge Island, March 24, 1942",q:"All persons of Japanese ancestry, \"including aliens and nonaliens,\" must leave Bainbridge Island by noon, March 30, 1942.",p:"The first exclusion order in the country. 227 Islanders had six days' notice. Families could bring only bedding, clothes, toilet articles and eating utensils: only what they could carry."},
review:{t:"The Bainbridge Review",k:"Walt and Milly Woodward, editors",p:"The Woodwards' small island weekly was the only West Coast newspaper to speak out against the removal. They kept publishing news from Islanders in the camps, so their neighbors would not forget them."},
manzanar:{t:"Manzanar",k:"War Relocation Center, Owens Valley, California",p:"One of ten War Relocation Authority camps. At its peak about 10,000 people lived there in rows of tar-paper barracks, surrounded by barbed wire and eight guard towers with searchlights. Bainbridge Islanders were among its first prisoners."},
camplife:{t:"Daily life in the camps",k:"Historical note",p:"Families lived in single rooms with army cots, one light bulb and a stove, sleeping on sacks stuffed with straw at first. Hundreds of people shared each mess hall, laundry and latrine, and the latrines had no partitions. Eating in mess halls broke up family meals. People built furniture from scrap, planted gardens, started schools, newspapers and baseball leagues, and made the camps livable however they could."},
idcards:{t:"Identity cards",k:"Historical note",p:"Rwanda's 1994 population of about 7 million was roughly 85% Hutu, 14% Tutsi and 1% Twa. The groups shared one language and the same traditions. Belgian colonial rulers favored the Tutsi minority and required every Rwandan to carry an identity card naming their ethnic group. In 1994, killers at roadblocks used those cards to choose who would die."},
rtlm:{t:"RTLM: hate radio",k:"Primary source: radio broadcasts, 1993–1994",p:"Radio-Télévision Libre des Mille Collines began broadcasting in July 1993. It mixed popular music with propaganda calling Tutsi \"inyenzi\" (cockroaches) and, during the genocide, read out names and locations of people to be killed. Propaganda that dehumanizes a group is a warning sign of genocide."},
unamir:{t:"The world's response",k:"UN and U.S. government records",p:"In January 1994 UN commander Roméo Dallaire warned that extremists were planning to exterminate Tutsi and asked for more troops and a stronger mandate; he was refused. After the killing began, the UN cut its force of about 2,500 peacekeepers to 270. The United States evacuated its citizens and, for weeks, would only say that \"acts of genocide\" had occurred."},
rescuers:{t:"Rescuers",k:"Historical note",p:"A small number of Hutu, and some others, hid Tutsi neighbors and strangers in their homes, fields and ceilings, risking death if discovered. Like the rescuers of the Holocaust, they were the exception, not the rule."},
gacaca:{t:"The gacaca courts",k:"2005–2012",p:"With hundreds of thousands of suspects and much of the justice system destroyed, Rwanda revived community courts held outdoors on the grass. Elected local judges heard confessions and testimony. When the courts closed in 2012 they had heard nearly two million cases. Supporters say they revealed the truth and helped people live together again; critics say trials were rushed and witnesses were sometimes threatened. Leaders of the genocide were tried by Rwandan courts and by the UN's International Criminal Tribunal for Rwanda."},
kwibuka:{t:"Kwibuka: remembering",k:"Historical note",p:"Every year, beginning on April 7, Rwanda holds Kwibuka (\"to remember\"), a national period of mourning. Survivor testimony about the genocide against the Tutsi is collected by organizations including USC Shoah Foundation (IWitness) and the Kigali Genocide Memorial."},
boarding:{t:"Indian boarding schools",k:"Historical note",p:"From the late 1800s, the U.S. government removed many Native children to boarding schools meant to erase their languages, religions and cultures. Children's hair was cut, their names changed, and they were punished for speaking their own languages. In 2024, President Biden formally apologized for the federal Indian boarding school policy."},
recruit:{t:"Recruiting Navajo Marines",k:"1942",p:"The Marine Corps sent officers to the Navajo reservation and to government boarding schools to recruit young men fluent in both Navajo and English. Many enlisted while their own states still denied Native Americans the vote."},
navcode:{t:"The Navajo code",k:"Primary source: the Navajo code dictionary (declassified)",q:"Tank: chay-da-gahi (tortoise). Submarine: besh-lo (iron fish). Letter A: wol-la-chee (ant).",p:"The original 29 built an alphabet of Navajo words and hundreds of terms for military equipment, drawn from nature. Navajo was unwritten and extremely complex. Code talkers memorized everything; nothing was written down in combat. The code was never broken."},
iwo:{t:"Code talkers at Iwo Jima",k:"February–March 1945",p:"During the first two days at Iwo Jima, six Navajo code talkers worked around the clock and sent more than 800 messages without error. Some code talkers were mistaken for Japanese soldiers by other Americans, and some were assigned bodyguards."},
secret:{t:"Secret for decades",k:"Historical note",p:"The code stayed classified long after the war, in case it was needed again, so the code talkers could not tell even their families what they had done. In 2000 Congress awarded the Congressional Gold Medal to the original 29 and silver medals to those who followed; the medals were presented in 2001."},
pedropan:{t:"Operation Pedro Pan",k:"December 1960 – October 1962",p:"14,048 Cuban children flew to the United States without their parents. Monsignor Bryan O. Walsh of Miami's Catholic Welfare Bureau and others arranged visa waivers and care. Children without relatives were housed in camps such as Kendall, Florida City, Opa-locka and Matecumbe, then placed in foster homes and institutions across 30 states. The airlift ended when the Cuban Missile Crisis stopped flights."},
cuba59:{t:"The Cuban Revolution and the Cold War",k:"1959–1962",p:"In 1959 Fidel Castro's revolution overthrew the dictator Fulgencio Batista. Castro's government soon allied with the Soviet Union. In April 1961, a CIA-backed invasion by Cuban exiles failed at the Bay of Pigs. In October 1962, Soviet nuclear missiles in Cuba brought the world close to nuclear war."},
rumor:{t:"Rumor and fear",k:"Evaluating sources",p:"Many parents were frightened by rumors that the new government would take legal custody (patria potestad) of children. Such a law was never passed. Historians still debate how the rumors spread and who spread them, including the role of anti-Castro radio. Ask: who benefits from a rumor?"},
literacy:{t:"The 1961 literacy campaign",k:"Cuba",p:"In 1961 Cuba sent more than a hundred thousand volunteers, many of them teenagers, into the countryside to teach people to read. It sharply reduced illiteracy, and it was also a way to spread the revolution's ideas. Families saw it very differently."},
refugio:{t:"The Freedom Tower",k:"Miami, Florida",p:"From 1962 the Freedom Tower in Miami served as the Cuban Refugee Center, where exiles received food, medical care and help finding work. It is now a National Historic Landmark. The \"Freedom Flights\" of 1965–1973 later reunited many families."},
a_rum:{t:"Artifact: a rum barrel",k:"The triangle trade",p:"Rhode Island distilleries turned Caribbean molasses into rum. Ships carried the rum to West Africa and traded it for captive people, who were carried to the Caribbean and sold, and the ships came home with molasses. Rhode Island merchants were colonial North America's leading slave traders."},
a_wheatley:{t:"Artifact: a book of poems",k:"Phillis Wheatley, 1773",p:"Kidnapped from West Africa as a child and enslaved in Boston, Phillis Wheatley published Poems on Various Subjects, Religious and Moral in 1773, the first book of poetry by an African American woman. Her work proved to many readers what abolitionists already argued: that Africans were equal in mind and spirit."},
a_brookes:{t:"Artifact: the Brookes diagram",k:"Abolitionist print, 1788–1789",p:"British abolitionists printed a plan of the slave ship Brookes, showing how hundreds of captives were packed into the hold. Copies were printed in Philadelphia and New York, and it became one of the most famous images of the abolition movement. Ask: why was a picture so powerful?"},
a_quilt:{t:"Artifact: a quilt",k:"Myth or history?",p:"You may have heard that quilts hung on fences held secret Underground Railroad codes. Historians have found no evidence from the time to support it; the story became popular in the 1990s. Freedom seekers relied on people, word of mouth, the North Star and their own courage. Checking a story against evidence is what historians do."},
a_northstar:{t:"Artifact: the North Star",k:"Navigation",p:"Freedom seekers often traveled at night and followed the North Star. The song \"Follow the Drinking Gourd\" (the Big Dipper) is often linked to the Underground Railroad, but it was first published in 1928, and historians debate whether it was really used."},
a_douglass:{t:"Artifact: a sailor's protection paper",k:"Frederick Douglass, 1838",p:"Frederick Douglass escaped from slavery in Baltimore in 1838 by train and boat, dressed as a sailor and carrying papers borrowed from a free Black seaman. He became the most famous abolitionist speaker and writer in America."},
a_longwalk:{t:"Artifact: a treaty",k:"The Long Walk and the Treaty of 1868",p:"In 1864 the U.S. Army forced thousands of Navajo people to walk hundreds of miles to Bosque Redondo in New Mexico, where many died. The Treaty of 1868 allowed the Navajo to return to part of their homeland. Code talkers' grandparents remembered the Long Walk."},
a_johnston:{t:"Artifact: a letter to the Marines",k:"Philip Johnston, 1942",p:"Philip Johnston, a World War I veteran who grew up on the Navajo reservation as the son of a missionary, suggested using the Navajo language for military communications. The Marines tested the idea in early 1942, and recruited the first 29 that spring."},
a_comanche:{t:"Artifact: an Army radio",k:"Other code talkers",p:"The Navajo were not the only code talkers. Choctaw soldiers used their language in World War I, and Comanche code talkers landed at Utah Beach on D-Day in 1944. Men from many Native nations served this way."},
a_korczak:{t:"Artifact: an orphanage sign",k:"Janusz Korczak",p:"Janusz Korczak, a famous doctor and children's author, ran an orphanage in the Warsaw ghetto. In August 1942 he was offered chances to save himself, but he went with his children when they were deported to Treblinka."},
a_uprising:{t:"Artifact: a fighters' armband",k:"The Warsaw Ghetto Uprising, 1943",p:"On April 19, 1943, the ghetto's remaining Jewish fighters, led by 24-year-old Mordecai Anielewicz, rose up against the Germans. They held out for weeks, the largest Jewish revolt of the war. Anielewicz died on May 8, 1943."},
a_ringelblum:{t:"Artifact: Ringelblum's notebook",k:"Emanuel Ringelblum",p:"Ringelblum escaped the ghetto and hid with his family in a bunker outside it. In March 1944 the hiding place was discovered, and he, his family and the Polish people who hid them were killed. His archive survived."},
a_lange:{t:"Artifact: a photograph",k:"Dorothea Lange, 1942",p:"The War Relocation Authority hired photographer Dorothea Lange to document the removal. Her photographs showed the injustice so clearly that many were impounded by the Army and not widely seen for decades. Ask: why would a government hide its own photographs?"},
a_freepress:{t:"Artifact: a camp newspaper",k:"The Manzanar Free Press",p:"Incarcerated people wrote and published newspapers in the camps, like the Manzanar Free Press, under the eye of camp administrators. They covered sports, schools, weddings and rules, and give historians a view of daily life from inside."},
a_korematsu:{t:"Artifact: a court record",k:"Fred Korematsu",p:"Fred Korematsu refused to report for removal and was arrested and convicted. In 1944 the Supreme Court upheld his conviction. In 1983 a federal court overturned it, and in 1998 he received the Presidential Medal of Freedom."},
a_marti:{t:"Artifact: a statue of José Martí",k:"Cuba and Florida",p:"José Martí, Cuba's national hero, organized the 1890s fight for independence from Spain while living in exile in New York and traveling to Cuban communities in Tampa and Key West. Cuban exiles in Florida are part of a long history."},
a_calle8:{t:"Artifact: a café cup",k:"Little Havana",p:"As exiles settled in Miami, the neighborhood around Calle Ocho (SW 8th Street) became Little Havana, full of Cuban cafés, shops and Spanish-language businesses. Cuban Americans transformed Miami's economy, culture and politics."},
a_adjust:{t:"Artifact: a green card",k:"Cuban Adjustment Act, 1966",p:"In 1966 Congress allowed Cubans who had been in the U.S. for a year to apply for permanent residence, a policy shaped by the Cold War that no other national group received in the same way."},
a_arusha:{t:"Artifact: a peace agreement",k:"The Arusha Accords, 1993",p:"In August 1993 the Rwandan government and the Rwandan Patriotic Front signed the Arusha Accords to end their civil war and share power. Extremists who opposed sharing power planned the genocide partly to destroy the agreement."},
a_stages:{t:"Artifact: a teacher's chart",k:"Genocide is a process",p:"Genocide does not happen suddenly. Scholars describe warning stages: classifying people into groups, marking them (like ethnic ID cards), dehumanizing them (like calling them cockroaches), organizing killers, and more. Recognizing the stages is how people try to prevent genocide."},
a_memorial:{t:"Artifact: a remembrance flame",k:"Kigali Genocide Memorial",p:"The Kigali Genocide Memorial, opened in 2004, is both a burial place for victims and a museum. Visitors from around the world come to learn, and survivors gather there every April during Kwibuka."},
issei:{t:"The Issei dilemma",k:"Historical note",p:"Issei (Japanese immigrants) were barred by U.S. law from becoming citizens. Question 28 asked them to give up any loyalty to Japan's emperor. Answering yes could leave them with no country at all. The government later reworded the question for Issei."},
q2728:{t:"The \"loyalty questionnaire\" (1943)",k:"Questions 27 and 28",q:"Question 27: \"Are you willing to serve in the armed forces of the United States on combat duty, wherever ordered?\"",p:"Question 28 asked people to swear unqualified allegiance to the United States and \"forswear\" any allegiance to the Emperor of Japan. About 65,000 answered an unqualified yes, about 6,700 answered no to question 28, and about 2,000 qualified their answers. Many who answered no were sent to Tule Lake."}

async function mosesTalk(){
 if(G.f.met)return say("moses","The Hope lies at the end of the wharf. Find proof of where she has been.");
 await say("moses","Peter. Thee knows the ship Hope? She belongs to my own brother, John.");
 const a=await say("moses","We believe she carried Africans to Havana last year. The law forbids it, but the court needs proof. Will thee help?",["I'll find it.","Why does a Quaker care so much?"]);
 if(a===1)await say("moses","Because every soul is made in God's image. And because I once held people in bondage myself, and freed them.");
 addSrc("act1794");addSrc("quakers");G.f.met=1;obj("Gather evidence on the waterfront","Talk to sailors. Find the shipping notice. Then board the Hope at the far end.");
}
async function amosTalk(){
 const a=await say("amos","Careful, Peter. John Brown is the richest man in Providence. A Black boy who crosses him…",["I know. Someone has to.","Will you help?"]);
 addSrc("freeblack");
 if(a===1){await say("amos","I sailed on ships like that once, as crew. Look below deck, at the beams and the water casks. Wood remembers.");G.f.tip=1}
 else await say("amos","Then be smart about it. Firsthand proof. Not gossip.");
}

async function testify(){

 if(EV.length){const ch=await pick("Build your evidence board: choose up to 3 pieces to show the court.",EV.map(e=>e[0]),3);let sc=0;for(const i of ch){await say("narr",EV[i][2]);sc+=EV[i][1]}G.ev=Math.min(5,sc);G.f.board=1;
  await consq(sc>=6?"Your evidence holds up. Every piece supports the others.":sc>=3?"Some of your evidence holds, but Brown's lawyer found weak spots.":"Brown's lawyer tears your evidence apart.","Historians and courts trust evidence most when several independent sources agree, a principle called corroboration.")}
 const a=await say("narr","You take the stand. What will you tell the court?",["Only what you saw with your own eyes","Everything, including what sailors told you"]);
 if(a===1&&!G.f.witness)G.ev=Math.max(0,G.ev-1);
 if(a===1&&G.f.witness)await say("narr","The judge stops you: Sam Carr must tell his own story. Luckily, he is here to testify.");
 ending();
}

  cards:[["Abolition began early","Long before the Civil War, Black and white Americans organized societies, wrote pamphlets and sued slave traders in court."],["The Quaker brothers","Moses Brown fought the slave trade; his brother John defended it. Families and towns were divided, and the trade made Rhode Island rich."],["Captives' voices","Ship records counted people as cargo. Accounts like Olaudah Equiano's are how we hear the people in the hold."],["Laws without enforcement","The 1794 and 1808 laws mattered, but only when someone did the dangerous work of enforcing them."]],

async function garrettTalk(){
