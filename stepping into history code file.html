<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepping into History- VPezzotti's Educational Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* VOICE: serious and quiet; real games about real people, never a "win screen" about suffering.
   IDEA: a timeline of four lantern-lit side-scrollers; the world tells the story, words stay short.
   PICTURE: the game canvas: animated characters, parallax places from 1797 to 1943.
   COLOUR and TYPE: night green-black, parchment dialogue, lantern-red accent; IM Fell English + Source Serif.
   LAYOUT: timeline title, HUD bar, 16:9 game, dialogue over the game (below on phones), touch pad. */
:root{color-scheme:dark;--night:#10262a;--deep:#0a191c;--page:#efe4cc;--page2:#e3d4b3;--ink:#2a1d14;--muted:#6b5640;--lamp:#d9542b;--glow:#f2b45a;--line:#c9b48c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1d3b3f 0,var(--night) 45%,var(--deep) 100%) fixed;color:var(--page);font:17px/1.55 "Source Serif 4",Georgia,serif;overflow-x:clip;min-height:100vh}
h1,h2,h3{font-family:"IM Fell English",Georgia,serif;font-weight:400}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(12px,2.5vw,28px) max(3vw,10px) 40px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.hide{display:none!important}
.hud{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.obj{font-size:15px;max-width:46ch}.obj b{color:var(--glow);font-weight:600;display:block;font-family:"IM Fell English";font-size:21px;line-height:1.1}
.stats{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.m{width:112px;font-size:13px}.trk{height:7px;background:#ffffff1f;border-radius:4px;margin-top:2px;overflow:hidden}.trk i{display:block;height:100%;background:var(--glow);transition:width .4s}
.m.red .trk i{background:var(--lamp)}
.jbtn{background:transparent;color:var(--page);border:1px solid #efe4cc66;border-radius:6px;padding:8px 12px;min-height:44px}
.jbtn em{font-style:normal;background:var(--lamp);color:#fff;border-radius:9px;padding:0 7px;margin-left:6px;font-size:13px}
.ink{color:var(--ink);border-color:var(--line)}
.game{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 20px 50px #0009;border:1px solid #ffffff14;background:#000}
canvas#cv{display:block;width:100%;aspect-ratio:16/9;touch-action:none}
.dlg{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:14px;background:linear-gradient(var(--page),var(--page2));color:var(--ink);border-radius:8px;padding:12px 16px;box-shadow:0 8px 30px #0008;animation:up .25s ease;max-height:calc(100% - 24px);overflow:auto}
@keyframes up{from{transform:translateY(12px);opacity:0}}
@media(prefers-reduced-motion:reduce){.dlg{animation:none}}
.dlg canvas{width:84px;height:84px;flex:none;border-radius:6px;background:#2a3b3c}
.dlg .nm{font-family:"IM Fell English";color:var(--lamp);font-size:20px;line-height:1.1}
.dlg .tx{font-size:17px;margin:2px 0 8px;white-space:pre-line}
.dlg.cons{background:linear-gradient(#fff4dc,#f0d9a8);border:2px solid var(--lamp)}.dlg.cons .nm{font-size:22px}
.tbar{height:8px;background:#2a1d1422;border-radius:4px;margin:0 0 8px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--lamp);width:100%}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.badge{background:#fff8e8;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:15px;min-width:200px}.badge b{display:block;color:var(--lamp);font-family:"IM Fell English";font-size:19px}.badge.off{opacity:.45}
.path li{margin-bottom:10px}.path small{display:block;color:var(--muted)}
.stars{color:var(--glow);font-size:18px;letter-spacing:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:#fff8e8;color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--lamp);border-radius:6px;padding:8px 14px;min-height:44px;text-align:left}
.opt:hover{background:#fff}.opt[aria-pressed=true]{background:#f2b45a;border-left-color:var(--ink)}
.opt.done{background:var(--lamp);color:#fff;border-color:var(--lamp)}
.opt kbd{font:600 12px/1 "Source Serif 4";background:#2a1d1418;border-radius:3px;padding:2px 5px;margin-right:6px}
.fadeov{position:absolute;inset:0;background:#05090c;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .6s;font-family:"IM Fell English";font-size:clamp(20px,3.2vw,36px);color:var(--page);text-align:center;padding:20px}
.fadeov.on{opacity:1;pointer-events:auto}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#0a191ce6;border:1px solid var(--glow);color:var(--page);padding:7px 14px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.pad{display:flex;justify-content:space-between;gap:8px;margin-top:10px;user-select:none;-webkit-user-select:none;flex-wrap:wrap}
.pad div{display:flex;gap:8px}
.pb{background:#ffffff12;color:var(--page);border:1px solid #ffffff2e;border-radius:10px;min-width:60px;min-height:56px;padding:6px 12px;font-size:16px;touch-action:none}
.pb.on{background:var(--glow);color:var(--ink)}.pb.act{background:var(--lamp);border-color:var(--lamp);color:#fff}
.keys{font-size:14px;color:#cfc4ac;margin-top:8px}
.hero{display:grid;gap:20px}
.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px}
.mc{background:#ffffff0d;border:1px solid #ffffff24;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:6px}
.mc h3{margin:0;font-size:23px;line-height:1.1}.mc p{margin:0;font-size:15px;color:#e8dcc4;flex:1}.mc .yr{font-size:14px;color:var(--glow)}
.mc .go{align-self:flex-start;font-size:16px;padding:10px 18px;min-height:44px}
.mc .done{font-size:13px;color:#b8d8b0}
.note{background:#ffffff0d;border-left:3px solid var(--lamp);padding:12px 16px;font-size:15px;border-radius:4px;max-width:80ch}
.go{background:var(--lamp);color:#fff;border:0;border-radius:6px;padding:13px 24px;min-height:48px;font-weight:600;font-size:18px}
.paper{background:linear-gradient(var(--page),var(--page2));color:var(--ink);border-radius:10px;padding:clamp(18px,3vw,34px) clamp(18px,4vw,44px)}
.paper p{max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px;margin:14px 0}
.card{background:#fff8e8;border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:15px}
.card h3{margin:0 0 4px;font-size:20px;color:var(--lamp)}
ol.q li{margin-bottom:8px}
.std{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
.std td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}.std td:first-child{white-space:nowrap;font-weight:600;color:var(--lamp);width:9.5em}
.drawer{position:fixed;inset:0;background:#0009;display:none;z-index:9}.drawer.on{display:block}
.jr{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--page);color:var(--ink);padding:24px;overflow:auto}
.jr h2{margin:0;font-size:30px}
.src{border-top:1px solid var(--line);padding:14px 0}.src h3{margin:0 0 4px;font-size:20px;color:var(--lamp)}
.src .k{font-size:13px;color:var(--muted);font-style:italic}.src p{margin:6px 0 0;font-size:15px}
blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--lamp);background:#fff8e8;font-size:15px}
@media(max-width:700px){.dlg{position:static;border-radius:0;animation:none;max-height:none}.dlg canvas{width:60px;height:60px}.m{width:92px}.obj{font-size:14px}.pb{min-width:52px;padding:6px 8px}.std td:first-child{width:auto;white-space:normal}}
</style>
</head>
<body>
<div class="wrap">
 <section id="title"></section>
 <section id="play" class="hide">
  <div class="hud"><div class="obj" id="obj"></div><div class="stats"><div id="bars" style="display:flex;flex-wrap:wrap;gap:8px 12px"></div><button class="jbtn" id="rst">Restart</button><button class="jbtn snd" id="sndH">Sound</button><button class="jbtn vob" id="voH">Voices</button><button class="jbtn" id="vsetH">Voice settings</button><button class="jbtn" id="jb">Journal<em id="jn">0</em></button></div></div>
  <div class="game" id="game">
   <canvas id="cv" width="1920" height="1080" aria-label="Game view"></canvas>
   <div class="fadeov" id="fade"></div><div class="toast" id="toast"></div>
   <div class="dlg hide" id="dlg"><canvas id="pt" width="168" height="168"></canvas><div style="flex:1"><div class="nm" id="nm"></div><div class="tx" id="tx"></div><div class="opts" id="opts"></div></div></div>
  </div>
  <div class="pad">
   <div><button class="pb" id="pL" aria-label="Walk left">◀</button><button class="pb" id="pR" aria-label="Walk right">▶</button><button class="pb" id="pJ">Jump</button></div>
   <div><button class="pb" id="pH">Hide</button><button class="pb" id="pF">Throw</button><button class="pb act" id="pT">Talk</button></div>
  </div>
  <div class="keys" id="keys"></div>
 </section>
 <section id="end" class="hide"></section>
</div>
<div class="drawer" id="drawer"><div class="jr" role="dialog" aria-label="Panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 id="dt">Journal</h2><button class="jbtn ink" id="closeJ">Close</button></div><div id="jlist"></div></div></div>

<script>
{
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const VW=960,VH=540,GY=455;

/* ================= audio (synthesized; all music original) ================= */
const AU=(()=>{
 let ctx,master,mus,sfx,amb,nb,muted=false,scene=null,nextT=0,idx=0,pat=null,drone=[],waterG,windG,evt=null;
 try{muted=localStorage.getItem("hist-mute")==="1"}catch(e){}
 const PATS={
  theme:{bpm:66,base:62,vol:.15,drone:[38,45],notes:[[7,2],[10,1],[7,1],[5,2],[3,2],[0,3],[3,1],[5,2],[null,2],[7,2],[10,1],[12,1],[10,2],[7,2],[5,3],[3,1],[0,4],[12,2],[10,1],[7,1],[10,2],[7,2],[5,2],[3,2],[5,2],[7,2],[3,2],[0,1],[-2,1],[0,4],[null,4]]},
  night:{bpm:54,base:50,vol:.13,drone:[38,45],notes:[[7,4],[5,2],[3,2],[0,6],[null,2],[3,2],[5,2],[0,8],[null,6],[10,3],[7,1],[5,4],[null,8]]},
  dawn:{bpm:70,base:62,vol:.13,drone:[38,50],notes:[[0,2],[4,2],[7,2],[9,2],[7,4],[4,2],[2,2],[0,6],[null,2],[7,2],[9,2],[12,4],[9,2],[7,2],[4,2],[2,2],[0,8]]},
  sea:{bpm:60,base:57,vol:.14,drone:[45,52],notes:[[0,2],[3,1],[5,1],[7,3],[5,1],[3,2],[0,2],[null,2],[7,2],[8,1],[7,1],[5,2],[3,2],[2,2],[0,6],[null,2]]},
  somber:{bpm:50,base:57,vol:.11,drone:[45,52],notes:[[7,4],[8,2],[7,2],[5,4],[3,4],[null,4],[3,2],[5,2],[7,3],[5,1],[3,4],[2,2],[0,6],[null,6]]},
  home:{bpm:72,base:60,vol:.12,drone:[36,43],notes:[[4,2],[7,2],[9,2],[7,2],[4,2],[2,2],[0,4],[2,2],[4,2],[7,4],[5,2],[4,2],[2,8],[null,2]]},
  camp:{bpm:58,base:57,vol:.12,drone:[33,45],notes:[[0,3],[2,1],[3,2],[7,2],[5,4],[3,2],[2,2],[0,6],[null,4],[3,2],[5,2],[7,2],[10,2],[8,4],[7,4],[null,6]]}
 };
 const AMB={night:[.05,.02,"crickets"],street:[0,.05,"town"],dawn:[0,.025,"birds"],harbor:[.06,.04,"gulls"],ship:[.04,.01,"creaks"],quiet:[0,.02,null],winter:[0,.06,null],island:[.04,.03,"birds"],desert:[0,.08,null]};
 const SCN={title:["theme","night"],end:["dawn","quiet"],w_docks:["sea","harbor"],w_deck:["night","ship"],w_ship:["sea","ship"],w_court:["dawn","quiet"],street:["theme","street"],barn:["night","night"],creek:["night","night"],border:["dawn","dawn"],h_street:["somber","winter"],h_july:["somber","quiet"],h_cellar:["somber","quiet"],b_island:["home","island"],b_dock:["home","harbor"],b_arrive:["camp","desert"],n_school:["home","dawn"],n_camp:["camp","quiet"],n_iwo:["night","desert"],n_home:["dawn","dawn"],p_havana:["home","harbor"],p_airport:["somber","quiet"],p_miami:["dawn","island"],r_kigali:["home","dawn"],r_hide:["somber","quiet"],r_july:["somber","quiet"],r_gacaca:["dawn","dawn"],b_camp:["camp","desert"]};
 const mtof=m=>440*Math.pow(2,(m-69)/12);
 function init(){
  if(ctx){if(ctx.state!=="running")ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{ctx=new AC()}catch(e){return}
  master=ctx.createGain();master.gain.value=muted?0:.9;master.connect(ctx.destination);
  const del=ctx.createDelay(),fb=ctx.createGain(),wet=ctx.createGain(),lp=ctx.createBiquadFilter();
  del.delayTime.value=.33;fb.gain.value=.32;wet.gain.value=.35;lp.type="lowpass";lp.frequency.value=1800;
  mus=ctx.createGain();mus.connect(master);mus.connect(del);del.connect(lp);lp.connect(fb);fb.connect(del);lp.connect(wet);wet.connect(master);
  sfx=ctx.createGain();sfx.connect(master);amb=ctx.createGain();amb.connect(master);
  nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const dd=nb.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
  const loopN=(type,f,q)=>{const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ctx.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(amb);s.start();return g};
  waterG=loopN("bandpass",700,.6);windG=loopN("lowpass",320,.7);
  setInterval(tick,100);
 }
 function voice(f,t,dur,vol){
  const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),lp=ctx.createBiquadFilter(),lfo=ctx.createOscillator(),lg=ctx.createGain();
  o.type="triangle";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2.003;lfo.frequency.value=5;lg.gain.value=f*.006;
  lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);g2.gain.value=.25;o2.connect(g2);g2.connect(lp);o.connect(lp);
  lp.type="lowpass";lp.frequency.value=1500;lp.connect(g);g.connect(mus);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.18);g.gain.setValueAtTime(vol,t+Math.max(.2,dur-.25));g.gain.linearRampToValueAtTime(0,t+dur+.5);
  for(const x of[o,o2,lfo]){x.start(t);x.stop(t+dur+.6)}
 }
 function setDrone(notes){
  const t=ctx.currentTime;drone.forEach(x=>{x.g.gain.cancelScheduledValues(t);x.g.gain.setTargetAtTime(0,t,.8);x.o.stop(t+4)});
  drone=notes.map(m=>{const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type="sawtooth";o.frequency.value=mtof(m);lp.type="lowpass";lp.frequency.value=260;g.gain.value=0;o.connect(lp);lp.connect(g);g.connect(mus);o.start();g.gain.setTargetAtTime(.03,t,1.5);return{o,g}});
 }
 function nz(t,dur,type,f,q,vol,dest){const s=ctx.createBufferSource();s.buffer=nb;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(dest||sfx);s.start(t,Math.random());s.stop(t+dur+.05)}
 function tone(t,f,dur,vol,type,dest,f2){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||sfx);o.start(t);o.stop(t+dur+.05)}
 function tick(){
  if(!ctx||!pat)return;const now=ctx.currentTime;
  if(nextT<now)nextT=now+.05;
  while(nextT<now+.3){const[n,b]=pat.notes[idx];const dur=b*60/pat.bpm;if(n!==null)voice(mtof(pat.base+n),nextT,dur,pat.vol);nextT+=dur;idx=(idx+1)%pat.notes.length}
  const r=Math.random();
  if(evt==="crickets"&&r<.35)for(let i=0;i<3;i++)tone(now+i*.05,4400+Math.random()*300,.03,.012,"sine",amb);
  if((evt==="birds"&&r<.12)||(evt==="town"&&r<.04)){tone(now,2400+Math.random()*800,.12,.02,"sine",amb,3600);tone(now+.15,2800,.1,.015,"sine",amb,2200)}
  if(evt==="town"&&r>.98){tone(now,820,.6,.02,"triangle",amb);tone(now,1230,.4,.012,"sine",amb)}
  if(evt==="gulls"&&r<.05){tone(now,1300,.35,.025,"sine",amb,850);tone(now+.4,1250,.3,.02,"sine",amb,800)}
  if(evt==="creaks"&&r<.08)tone(now,140+Math.random()*60,.6,.04,"triangle",amb,90);
 }
 return{
  init,
  scene(s){if(!ctx||!SCN[s]||scene===s)return;scene=s;const[pn,an]=SCN[s],p=PATS[pn],a=AMB[an];if(pat!==p){pat=p;idx=0;nextT=ctx.currentTime+.6;setDrone(p.drone)}const t=ctx.currentTime;waterG.gain.setTargetAtTime(a[0],t,1);windG.gain.setTargetAtTime(a[1],t,1);evt=a[2]},
  step(soft){if(ctx)nz(ctx.currentTime,.07,"lowpass",soft?250:420,1,soft?.05:.11)},
  jump(){if(ctx)nz(ctx.currentTime,.12,"bandpass",600,1,.12)},
  land(){if(ctx)nz(ctx.currentTime,.09,"lowpass",300,1,.16)},
  blip(){if(ctx)tone(ctx.currentTime,620,.12,.05)},
  click(){if(ctx)tone(ctx.currentTime,480,.08,.05,"triangle")},
  chime(){if(!ctx)return;const t=ctx.currentTime;tone(t,1046,.9,.06);tone(t+.12,1568,.9,.05)},
  cough(){if(!ctx)return;const t=ctx.currentTime;nz(t,.16,"bandpass",900,1.5,.5);nz(t+.24,.13,"bandpass",800,1.5,.4)},
  spotted(){if(!ctx)return;const t=ctx.currentTime;tone(t,110,1.6,.12,"sawtooth");tone(t,116.5,1.6,.1,"sawtooth");nz(t,.4,"lowpass",150,1,.6)},
  rustle(){if(ctx)nz(ctx.currentTime,.3,"highpass",1800,.7,.12)},
  heart(){if(!ctx)return;const t=ctx.currentTime;tone(t,58,.18,.22,"sine",sfx,40);tone(t+.2,52,.18,.16,"sine",sfx,38)},
  whoosh(){if(ctx)nz(ctx.currentTime,.25,"bandpass",1400,2,.12)},
  clack(){if(!ctx)return;const t=ctx.currentTime;tone(t,900,.08,.08,"square");nz(t,.1,"highpass",2000,1,.15)},
  shove(){if(!ctx)return;const t=ctx.currentTime;nz(t,.15,"lowpass",500,1,.3);tone(t,180,.15,.06,"triangle")},
  toggle(){muted=!muted;try{localStorage.setItem("hist-mute",muted?"1":"0")}catch(e){}if(master)master.gain.setTargetAtTime(muted?0:.9,ctx.currentTime,.05);return muted},
  get muted(){return muted}
 };
})();
function sndLabel(){document.querySelectorAll(".snd").forEach(b=>{b.textContent=AU.muted?"Sound: off":"Sound: on";b.setAttribute("aria-pressed",String(!AU.muted))})}
function sndToggle(){AU.init();AU.toggle();sndLabel()}


/* ================= character voices =================
   1) If a recorded file voice/<id>.mp3 is listed in voice/manifest.json, play the real recording.
   2) Otherwise use the device's most natural voice, with NO pitch shifting (pitch shifts are what sound robotic). */
const hid=s=>{let h=5381;for(const ch of s)h=((h*33)^ch.codePointAt(0))>>>0;return h.toString(36)};
const VO=(()=>{
 const ss=window.speechSynthesis;let on=true,voices=[],chain=false,MAN=new Set(),aud=null,pref={};
 try{on=localStorage.getItem("hist-voice")!=="0";pref=JSON.parse(localStorage.getItem("hist-vpref")||"{}")}catch(e){}
 try{fetch("voice/manifest.json").then(r=>r.ok?r.json():[]).then(a=>{MAN=new Set(a)}).catch(()=>{})}catch(e){}
 const load=()=>{try{voices=ss?ss.getVoices().filter(v=>/^en/i.test(v.lang)):[]}catch(e){voices=[]}};

 const FEM=/female|samantha|victoria|karen|zira|aria|jenny|susan|allison|ava|serena|moira|tessa|fiona|libby|sonia|emma|michelle|joanna|salli|kendra|kimberly|ivy|ana\b|clara|natasha|nancy|sara|jane|ashley|amber|cora|elizabeth|monica|zoe|google us english/i;

 const q=v=>(/natural|neural|online|premium|enhanced|siri/i.test(v.name)?6:0)+(/google/i.test(v.name)?3:0)+(/en[-_]US/i.test(v.lang)?1:0)-(/compact|espeak|robot|albert|bad news|bahh|bells|boing|bubbles|cellos|wobble|zarvox|trinoids|whisper|organ|jester|superstar|fred|ralph|junior|kathy|princess/i.test(v.name)?8:0)-(/^microsoft (david|zira|mark)\b(?!.*online)/i.test(v.name)?3:0);

 function pickV(g,seed){

 function rec(who,text){const id=hid(who+"|"+text);if(!MAN.has(id))return false;try{aud&&aud.pause();aud=new Audio("voice/"+id+".mp3");aud.play().catch(()=>{});return true}catch(e){return false}}

 return{speak,hid,

  setPref(k,name){if(name)pref[k]=name;else delete pref[k];try{localStorage.setItem("hist-vpref",JSON.stringify(pref))}catch(e){}},

 const csv="mission,character,file,line\n"+RSCRIPT.map(r=>[r[0],r[2]||"Narrator",r[4]+".mp3",r[3]].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");

 RSCRIPT.map(r=>`<div class="src" style="padding:10px 0"><div class="k">Mission ${r[0]} · ${r[2]||"Narrator"} · <b>${r[4]}.mp3</b></div><p style="margin:4px 0 0">${r[3].replace(/</g,"&lt;")}</p></div>`).join("");

 $("rsc").onclick=async()=>{try{await navigator.clipboard.writeText(csv);toast("Copied. Paste it into Sheets or Excel.",1)}catch(e){toast("Copy was blocked by the browser.",1)}};

function voiceSettings(){
 const L=VO.list(),good=L.filter(v=>v.q>=6).length;
 const sel=(k,label)=>`<label style="display:block;margin:10px 0 4px;font-weight:600">${label}</label><div style="display:flex;gap:8px;flex-wrap:wrap"><select data-k="${k}" style="font:inherit;font-size:16px;padding:8px;min-height:44px;flex:1;min-width:0;border-radius:6px;border:1px solid var(--line);background:#fff8e8;color:var(--ink)"><option value="">Automatic (best available)</option>${L.map(v=>`<option value="${v.name.replace(/"/g,"&quot;")}" ${VO.pref(k)===v.name?"selected":""}>${v.name}${v.q>=6?" ★ natural":""}</option>`).join("")}</select><button class="jbtn ink" data-t="${k}">Test</button></div>`;
 $("dt").textContent="Voice settings";
 $("jlist").innerHTML=`<p style="font-size:15px">${VO.recorded?`<b>${VO.recorded} recorded lines</b> are installed and will play as real human voices. Other lines use your device's voices.`:"Characters speak with your device's built-in voices. Pick the most natural ones below."}</p>
 <p style="font-size:15px;background:#fff8e8;border-left:3px solid var(--lamp);padding:10px 12px">${good?`Your device has <b>${good} natural-sounding voice${good>1?"s":""}</b> (marked ★). Automatic mode uses them first.`:"Your device has <b>no natural-sounding voices</b>, so speech will sound robotic."} For the most human voices: use <b>Microsoft Edge</b> (its \"Online (Natural)\" voices), or <b>Chrome</b> (\"Google\" voices). On a Mac or iPad, add an <b>Enhanced</b> or <b>Premium</b> voice in Settings → Accessibility → Spoken Content.</p>
 ${L.length?sel("n","Narrator")+sel("f","Women and girls")+sel("m","Men and boys"):"<p>This browser has no English voices available.</p>"}
 <p style="font-size:14px;color:var(--muted);margin-top:16px">For truly human voices, record voice actors (students, a drama club, or a voice service). Each line has a file name; save each recording as that name in MP3 and the game plays the real recording instead of the device voice.</p><button class="jbtn ink" id="rsb">Open the recording script (${RSCRIPT.length} lines)</button>`;
 $("jlist").querySelectorAll("select").forEach(s=>s.onchange=()=>VO.setPref(s.dataset.k,s.value));
 $("jlist").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>VO.test(b.dataset.t));$("rsb")&&($("rsb").onclick=recScript);
